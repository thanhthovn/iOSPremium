            function updateSummary() {
                const total = groups.reduce((n, g) => n + g.urls.length, 0);
                const statuses = [...results.querySelectorAll(".scanner-status")];
                const checked = statuses.filter(el => el.textContent !== "Chưa kiểm tra").length;
                const ok = statuses.filter(el => el.classList.contains("ok")).length;
                const bad = statuses.filter(el => el.classList.contains("bad")).length;
                summary.textContent = `${groups.length} nhóm · ${total} link · Đã test ${checked}/${total} · PHÁT ĐƯỢC: ${playableByGroup.size} nhóm · Lỗi: ${bad}`;
            }

            // XUẤT M3U — ghi đè bằng LINK GỐC từ linkworks.txt
            async function exportM3U() {
                exportBtn.disabled = true;
                const originalLabel = exportBtn.textContent;
                exportBtn.textContent = "ĐANG TẠO M3U...";

                try {
                    console.log("=== XUẤT M3U ===");
                    console.log("Winners (key → link gốc phát được):", [...playableByGroup.entries()]);

                    if (playableByGroup.size === 0) {
                        summary.textContent = "⚠ Chưa có link nào PHÁT ĐƯỢC (video bắn sự kiện playing). Hãy TEST LINK trước.";
                        return;
                    }

                    if (!currentPlaylistUrl) throw new Error("Chưa có link playlist M3U nguồn.");
                    const response = await fetch(currentPlaylistUrl, { cache: "no-store" });
                    if (!response.ok) throw new Error(`Không tải được playlist nguồn: HTTP ${response.status}`);
                    const originalText = await response.text();
                    if (!originalText.trimStart().startsWith("#EXTM3U")) {
                        throw new Error("Nội dung nguồn không phải playlist M3U hợp lệ.");
                    }

                    const lineEnding = originalText.includes("\r\n") ? "\r\n" : "\n";
                    const lines = originalText.split(/\r?\n/);
                    let replacements = 0;

                    function findNextUrlIndex(startIdx) {
                        for (let i = startIdx + 1; i < lines.length; i++) {
                            const t = lines[i].trim();
                            if (!t) continue;
                            if (t.startsWith("#")) continue;
                            return i;
                        }
                        return -1;
                    }

                    for (let i = 0; i < lines.length; i++) {
                        const trimmed = lines[i].trim();
                        if (!/^#EXTINF/i.test(trimmed)) continue;

                        const idMatch = trimmed.match(/tvg-id\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s,]+))/i);
                        const nameMatch = trimmed.match(/tvg-name\s*=\s*(?:"([^"]*)"|'([^']*)'|([^\s,]+))/i);
                        const comma = trimmed.lastIndexOf(",");
                        const displayName = comma >= 0 ? trimmed.substring(comma + 1).trim() : "";

                        const keyId = idMatch ? normalizeTvgId(idMatch[1] ?? idMatch[2] ?? idMatch[3] ?? "") : "";
                        const keyName = nameMatch ? normalizeTvgId(nameMatch[1] ?? nameMatch[2] ?? nameMatch[3] ?? "") : "";
                        const keyDisplay = normalizeTvgId(displayName);

                        let winner = null;
                        let matchedBy = "";
                        if (keyId && playableByGroup.has(keyId)) {
                            winner = playableByGroup.get(keyId);
                            matchedBy = "tvg-id";
                        } else if (keyName && playableByGroup.has(keyName)) {
                            winner = playableByGroup.get(keyName);
                            matchedBy = "tvg-name";
                        } else if (keyDisplay && playableByGroup.has(keyDisplay)) {
                            winner = playableByGroup.get(keyDisplay);
                            matchedBy = "display-name";
                        }

                        // Fallback LOOSE
                        if (!winner) {
                            const looseId = keyId ? normalizeLoose(keyId) : "";
                            const looseName = keyName ? normalizeLoose(keyName) : "";
                            const looseDisplay = keyDisplay ? normalizeLoose(keyDisplay) : "";
                            for (const [k, v] of playableByGroup) {
                                const looseK = normalizeLoose(k);
                                if ((looseId && looseK === looseId) ||
                                    (looseName && looseK === looseName) ||
                                    (looseDisplay && looseK === looseDisplay)) {
                                    winner = v;
                                    matchedBy = "loose";
                                    break;
                                }
                            }
                        }

                        if (winner) {
                            const urlIdx = findNextUrlIndex(i);
                            if (urlIdx !== -1) {
                                const urlLine = lines[urlIdx];
                                const leading = urlLine.match(/^\s*/)[0];
                                const trailing = urlLine.match(/\s*$/)[0];
                                lines[urlIdx] = leading + winner + trailing;
                                replacements++;
                                console.log(`✅ Match [${matchedBy}] id="${keyId}" name="${keyName}" display="${keyDisplay}"`);
                            }
                        } else {
                            console.log(`➖ Không match: id="${keyId}" name="${keyName}" display="${keyDisplay}"`);
                        }
                    }

                    console.log(`=== TỔNG GHI ĐÈ: ${replacements} kênh ===`);

                    if (replacements === 0) {
                        summary.textContent = `⚠ Có ${playableByGroup.size} link phát được nhưng không match kênh nào. Xem Console (F12) để rõ lý do.`;
                        return;
                    }

                    const finalText = lines.join(lineEnding);
                    const blob = new Blob([finalText], { type: "audio/x-mpegurl;charset=utf-8" });
                    const objectUrl = URL.createObjectURL(blob);
                    const a = document.createElement("a");
                    a.href = objectUrl;
                    a.download = "TRUYENHINHCAPVIETNAM_checked.m3u";
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);

                    summary.textContent = `✅ Đã xuất M3U · ghi đè ${replacements} kênh bằng link gốc PHÁT ĐƯỢC.`;
                } catch (err) {
                    console.error("LỖI XUẤT M3U:", err);
                    summary.textContent = "Không xuất được M3U: " + String(err?.message || err);
                } finally {
                    exportBtn.disabled = false;
                    exportBtn.textContent = originalLabel;
                }
            }

            exportBtn.addEventListener("click", exportM3U);

            async function loadFile() {
                loadBtn.disabled = true;
                allBtn.disabled = true;
                stopBtn.disabled = true;
                exportBtn.disabled = true;
                summary.textContent = "Đang tải linkworks.txt...";
                results.innerHTML = '<div class="scanner-empty">Đang tải file...</div>';
                try {
                    const response = await fetch(new URL("linkworks.txt", document.baseURI).href, { cache: "no-store" });
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    groups = parseLinkworks(await response.text());
                    render();
                } catch (err) {
                    groups = [];
                    exportBtn.disabled = true;
                    results.innerHTML = `<div class="scanner-empty">Không đọc được linkworks.txt (${String(err.message || err)}).<br>Đặt linkworks.txt cùng thư mục với trang HTML và chạy qua HTTP/HTTPS.</div>`;
                    summary.textContent = "Không tải được danh sách link.";
                } finally {
                    loadBtn.disabled = false;
                }
            }

            allBtn.addEventListener("click", () => {
                if (running) return;
                running = true;
                stopRequested = false;
                allBtn.disabled = true;
                stopBtn.disabled = false;
                loadBtn.disabled = true;
                let cursor = 0;

                const processNext = async () => {
                    if (!document.body.contains(modal)) {
                        running = false;
                        stopBtn.disabled = true;
                        return;
                    }

                    if (stopRequested) {
                        console.log("⏹ Người dùng yêu cầu dừng kiểm tra.");
                        summary.textContent = "⏹ Đã dừng kiểm tra. Bạn có thể bấm ⬇ XUẤT M3U với kết quả hiện có.";
                        running = false;
                        allBtn.disabled = false;
                        stopBtn.disabled = true;
                        loadBtn.disabled = false;
                        updateSummary();
                        return;
                    }

                    const rows = results.querySelectorAll(".scanner-link");
                    if (cursor >= rows.length) {
                        running = false;
                        allBtn.disabled = false;
                        stopBtn.disabled = true;
                        loadBtn.disabled = false;
                        updateSummary();
                        return;
                    }

                    const row = rows[cursor++];
                    const item = row._scanner;
                    if (item && item.status && item.status.textContent === "Chưa kiểm tra") {
                        try {
                            if (!playableByGroup.has(item.groupKey)) {
                                await testRow(item.testBtn, item.status, item.url, item.groupKey);
                            } else {
                                setStatus(item.status, "⏭ Bỏ qua — nhóm đã có link phát được ở trên.", "");
                            }
                        } catch (err) {
                            setStatus(item.status, "Lỗi khi kiểm tra: " + String(err?.message || err), "warn");
                        }
                        updateSummary();
                    }
                    setTimeout(processNext, 25);
                };

                setTimeout(processNext, 0);
            });

            stopBtn.addEventListener("click", () => {
                if (!running) return;
                stopRequested = true;
                stopBtn.disabled = true;
                summary.textContent = "⏹ Đang dừng sau khi hoàn tất link hiện tại...";
            });

            loadBtn.addEventListener("click", loadFile);
            loadFile();
        }

        function setupEventListeners() {
            channelGroupFilter.addEventListener("change", () => {
                selectedChannelGroup = channelGroupFilter.value || "__ALL__";
                renderChannels();
                scrollToActiveChannelInList();
            });

            if (videoControls) {
                player.addEventListener("mouseenter", showVideoControls);
                player.addEventListener("mousemove", showVideoControls);
                player.addEventListener("mouseleave", () => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !video.paused) {
                        hideVideoControls(1000);
                    }
                });

                videoControls.addEventListener("mouseenter", showVideoControls);
                videoControls.addEventListener("mousemove", showVideoControls);
                videoControls.addEventListener("mouseleave", () => {
                    if (!video.paused) hideVideoControls(700);
                });

                document.addEventListener("mousemove", (e) => {
                    const isFullscreen = !!(
                        document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement
                    );
                    if (!isFullscreen) return;

                    const rect = player.getBoundingClientRect();
                    const insidePlayer =
                        e.clientX >= rect.left &&
                        e.clientX <= rect.right &&
                        e.clientY >= rect.top &&
                        e.clientY <= rect.bottom;

                    if (insidePlayer) {
                        showVideoControls();
                        if (!video.paused) hideVideoControls(1500);
                    }
                });

                document.addEventListener("fullscreenchange", showVideoControls);
                document.addEventListener("webkitfullscreenchange", showVideoControls);
            }

            video.addEventListener("play", () => hideVideoControls(1800));
            video.addEventListener("pause", showVideoControls);
            video.addEventListener("ended", showVideoControls);

            let progressUpdateTimer = null;
            const scheduleProgressUpdate = () => {
                if (progressUpdateTimer !== null) return;
                progressUpdateTimer = setTimeout(() => {
                    progressUpdateTimer = null;
                    updateProgressState();
                }, 250);
            };

            video.addEventListener("timeupdate", scheduleProgressUpdate);
            video.addEventListener("durationchange", scheduleProgressUpdate);
            video.addEventListener("loadedmetadata", scheduleProgressUpdate);
            video.addEventListener("loadeddata", scheduleProgressUpdate);
            video.addEventListener("canplay", scheduleProgressUpdate);
            video.addEventListener("progress", scheduleProgressUpdate);

            progress.addEventListener("input", () => {
                const range = getSeekableRange();
                if (!progressSeekable || !range) return;
                const percent = Math.max(0, Math.min(100, Number(progress.value))) / 100;
                setProgressVisual(percent * 100);
                const previewTime = percent * (range.end - range.start);
                currentTimeEl.textContent = formatTime(previewTime);
            });

            let seekInProgress = false;
            let seekUnlockTimer = null;

            function performStableSeek() {
                if (seekInProgress) return;
                const range = getSeekableRange();
                if (!progressSeekable || !range) return;
                const percent = Math.max(0, Math.min(100, Number(progress.value))) / 100;
                const target = range.start + percent * (range.end - range.start);
                if (!Number.isFinite(target)) return;
                seekInProgress = true;
                video.currentTime = target;
                currentTimeEl.textContent = formatTime(target - range.start);
                clearTimeout(seekUnlockTimer);
                seekUnlockTimer = setTimeout(() => { seekInProgress = false; }, 1800);
            }

            video.addEventListener("seeked", () => {
                seekInProgress = false;
                clearTimeout(seekUnlockTimer);
                updateProgressState();
            });

            progress.addEventListener("change", performStableSeek);

            unmuteBanner.addEventListener("click", () => {
                video.muted = false;
                unmuteBanner.classList.add("hidden");
            });

            video.addEventListener("volumechange", () => {
                if (!video.muted) unmuteBanner.classList.add("hidden");
            });

            playBtn.addEventListener("click", () => {
                if (video.paused) video.play().catch(() => {});
                else video.pause();
            });

            video.addEventListener("play", updatePlayButton);
            video.addEventListener("pause", updatePlayButton);

            previousBtn.addEventListener("click", () => {
                const filteredChannels = getFilteredChannels();
                if (filteredChannels.length === 0) return;
                const currentPosition = filteredChannels.findIndex(channel => channel === channels[currentChannelIndex]);
                const prevPosition = (currentPosition - 1 + filteredChannels.length) % filteredChannels.length;
                const prevIndex = channels.indexOf(filteredChannels[prevPosition]);
                if (prevIndex !== -1) playChannelByIndex(prevIndex, true, false);
            });

            nextBtn.addEventListener("click", () => {
                const filteredChannels = getFilteredChannels();
                if (filteredChannels.length === 0) return;
                const currentPosition = filteredChannels.findIndex(channel => channel === channels[currentChannelIndex]);
                const nextPosition = (currentPosition + 1) % filteredChannels.length;
                const nextIndex = channels.indexOf(filteredChannels[nextPosition]);
                if (nextIndex !== -1) playChannelByIndex(nextIndex, true, false);
            });

            currentChannelBtn.addEventListener("click", scrollToActiveChannelInList);

            fullscreenBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleFullscreen();
            });

            calendarBtn.addEventListener("click", () => window.open(CALENDAR_URL, "_blank", "noopener,noreferrer"));
            cinemaxBtn.addEventListener("click", openLinkworksScanner);
            downloadAppBtn.addEventListener("click", () => window.open(DOWNLOAD_APP_URL, "_blank", "noopener,noreferrer"));
            xosoBtn.addEventListener("click", () => window.open(XOSO_URL, "_blank", "noopener,noreferrer"));

            channelCount.addEventListener("click", async () => {
                const modal = document.createElement("div");
                modal.className = "playlist-choice-modal";

                modal.innerHTML = `
                    <div class="playlist-choice-box">
                        <div class="playlist-choice-title">📺 NHẬP LINK .M3U HOẶC .M3U8</div>
                        <div class="playlist-choice-item">
                            <div class="playlist-choice-label">📋 LINK LIST .M3U</div>
                            <input id="m3uInput" class="playlist-choice-input" type="url"
                                placeholder="https://example.com/playlist.m3u"
                                value="${currentPlaylistUrl !== M3U_URL ? currentPlaylistUrl : ""}">
                            <button id="m3uOkBtn" class="playlist-choice-ok" type="button">OK</button>
                        </div>
                        <div class="playlist-choice-item">
                            <div class="playlist-choice-label">▶️ LINK .M3U8 STREAMING</div>
                            <input id="m3u8Input" class="playlist-choice-input" type="url"
                                placeholder="https://example.com/live/stream.m3u8">
                            <button id="m3u8OkBtn" class="playlist-choice-ok" type="button">OK</button>
                        </div>
                        <button id="playlistCancelBtn" class="playlist-choice-cancel" type="button">HỦY</button>
                    </div>
                `;

                document.body.appendChild(modal);

                const m3uInput = modal.querySelector("#m3uInput");
                const m3u8Input = modal.querySelector("#m3u8Input");
                const m3uOkBtn = modal.querySelector("#m3uOkBtn");
                const m3u8OkBtn = modal.querySelector("#m3u8OkBtn");
                const cancelBtn = modal.querySelector("#playlistCancelBtn");

                const closeModal = () => modal.remove();
                cancelBtn.addEventListener("click", closeModal);
                modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

                m3uOkBtn.addEventListener("click", async () => {
                    const tempUrl = m3uInput.value.trim();
                    if (!tempUrl) { alert("⚠️ Vui lòng nhập link M3U."); m3uInput.focus(); return; }
                    if (!/^https?:\/\//i.test(tempUrl)) { alert("⚠️ Link M3U phải bắt đầu bằng http:// hoặc https://"); m3uInput.focus(); return; }
                    m3uOkBtn.disabled = true;
                    m3uOkBtn.textContent = "ĐANG TẢI...";
                    try {
                        await loadPlaylist(tempUrl);
                        closeModal();
                    } catch (_) {} finally {
                        m3uOkBtn.disabled = false;
                        m3uOkBtn.textContent = "OK";
                    }
                });

                m3u8OkBtn.addEventListener("click", async () => {
                    const directUrl = m3u8Input.value.trim();
                    if (!directUrl) { alert("⚠️ Vui lòng nhập link M3U8."); m3u8Input.focus(); return; }
                    if (!/^https?:\/\//i.test(directUrl)) { alert("⚠️ Link M3U8 phải bắt đầu bằng http:// hoặc https://"); m3u8Input.focus(); return; }
                    m3u8OkBtn.disabled = true;
                    m3u8OkBtn.textContent = "ĐANG PHÁT...";
                    try {
                        await playDirectM3U8(directUrl);
                        closeModal();
                    } finally {
                        m3u8OkBtn.disabled = false;
                        m3u8OkBtn.textContent = "OK";
                    }
                });

                m3uInput.addEventListener("keydown", (e) => { if (e.key === "Enter") m3uOkBtn.click(); });
                m3u8Input.addEventListener("keydown", (e) => { if (e.key === "Enter") m3u8OkBtn.click(); });
                setTimeout(() => m3uInput.focus(), 0);
            });

            document.addEventListener("keydown", (e) => {
                if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
                switch (e.key) {
                    case "ArrowLeft":
                        e.preventDefault();
                        previousBtn.click();
                        break;
                    case "ArrowRight":
                        e.preventDefault();
                        nextBtn.click();
                        break;
                    case "f":
                    case "F":
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case "x":
                    case "X":
                        e.preventDefault();
                        scrollToActiveChannelInList();
                        break;
                    case "h":
                    case "H":
                        e.preventDefault();
                        window.scrollTo({ top: 0, behavior: "smooth" });
                        break;
                }
            });
        }

        function getActiveChannelElement() {
            return Array.from(document.querySelectorAll(".channel")).find(el => el.classList.contains("active")) || null;
        }

        function scrollToActiveChannelInList() {
            const activeChannel = getActiveChannelElement();
            if (!activeChannel) return;
            activeChannel.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
        }
    </script>
</body>

</html>
