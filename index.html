            </section>

            <aside class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <select id="channelGroupFilter" class="channel-group-filter" title="Chọn nhóm kênh">
                            <option value="__ALL__">Tất cả các kênh</option>
                        </select>

                        <button id="calendarBtn" class="calendar-btn" type="button" title="XEM LỊCH ÂM">📅</button>
                        <button id="cinemaxBtn" class="cinemax-btn" type="button" title="DÒ KÊNH TRONG LIST M3U">🔗</button>
                        <button id="downloadAppBtn" class="cinemax-btn download-app-btn" type="button" title="TẢI ỨNG DỤNG">🧩</button>
                        <button id="xosoBtn" class="cinemax-btn xoso-btn" type="button" title="XEM KẾT QUẢ XỔ SỐ">🎰</button>
                        <button id="footballBtn" class="cinemax-btn football-btn" type="button" title="LÀM MỚI LIST & PHÁT KÊNH CUỐI">⚽</button>
                        <button id="channelCount" class="channel-count" type="button" title="Đọc M3U hoặc xem trực tiếp M3U8">0 KÊNH</button>
                    </div>
                </div>

                <div id="channelList" class="channel-list">
                    <div class="loading">⏳ Đang tải danh sách kênh.....</div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const M3U_URL = "https://raw.githubusercontent.com/thanhthovn/iOSPremium/refs/heads/main/TRUYENHINHCAPVIETNAM.m3u";
        const CALENDAR_URL = "https://thanhthovn.github.io/amlichvn/";
        const DOWNLOAD_APP_URL = "https://1drv.ms/u/c/e92bb0b868c9b54b/IQDAtiObV-vZTqnq_xy47T4_AVqcoYbF40ZT1Wjkyukx9xY?e=jFlFse";
        const XOSO_URL = "https://thanhthovn.github.io/xsktvn/";

        let channels = [];
        let currentChannelIndex = -1;
        let activeChannelCard = null;
        let hls = null;
        let currentPlaylistUrl = M3U_URL;

        const LOW_END_HLS_CONFIG = {
            enableWorker: true,
            lowLatencyMode: false,
            manifestLoadingTimeOut: 8000,
            maxBufferLength: 15,
            maxMaxBufferLength: 20,
            backBufferLength: 5,
            maxBufferHole: 0.5,
            startFragPrefetch: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 6
        };

        let playRequestId = 0;

        const player = document.getElementById("player");
        const video = document.getElementById("video");
        const playerOverlay = document.getElementById("playerOverlay");
        const playerTitle = document.getElementById("playerTitle");
        const playerQualityBadge = document.getElementById("playerQualityBadge");
        const unmuteBanner = document.getElementById("unmuteBanner");
        const channelList = document.getElementById("channelList");
        const channelCount = document.getElementById("channelCount");
        const channelGroupFilter = document.getElementById("channelGroupFilter");
        let selectedChannelGroup = "__ALL__";
        const playBtn = document.getElementById("playBtn");
        const previousBtn = document.getElementById("previousBtn");
        const nextBtn = document.getElementById("nextBtn");
        const currentChannelBtn = document.getElementById("currentChannelBtn");
        const progress = document.getElementById("progress");
        const currentTimeEl = document.getElementById("currentTime");
        const durationTimeEl = document.getElementById("durationTime");
        const fullscreenBtn = document.getElementById("fullscreenBtn");
        const activeChannelLogo = document.getElementById("activeChannelLogo");
        const calendarBtn = document.getElementById("calendarBtn");
        const cinemaxBtn = document.getElementById("cinemaxBtn");
        const downloadAppBtn = document.getElementById("downloadAppBtn");
        const xosoBtn = document.getElementById("xosoBtn");
        const footballBtn = document.getElementById("footballBtn");

        let progressSeekable = false;
        let measuredStreamKbps = 0;
        let bitratePollTimer = null;
        let lastDecodedBytes = 0;
        let lastDecodedTime = 0;

        function resetPlayerQualityBadge() {
            clearInterval(bitratePollTimer);
            bitratePollTimer = null;
            lastDecodedBytes = 0;
            lastDecodedTime = 0;
            measuredStreamKbps = 0;
            if (playerQualityBadge) {
                playerQualityBadge.className = "player-quality-badge";
                playerQualityBadge.textContent = "";
            }
        }

        function formatQualityInfo(height, kbps = 0) {
            const h = Number(height) || 0;
            const k = Math.round(Number(kbps) || 0);
            if (h <= 0 && k <= 0) return null;

            let label = "";
            let cls = "q-sd";
            if (h >= 2160) { label = `4K UHD · ${h}p`; cls = "q-uhd"; }
            else if (h >= 1440) { label = `2K QHD · ${h}p`; cls = "q-uhd"; }
            else if (h >= 1080) { label = `FHD · ${h}p`; cls = "q-fhd"; }
            else if (h >= 720) { label = `HD · ${h}p`; cls = "q-hd"; }
            else if (h >= 480) { label = `SD · ${h}p`; cls = "q-sd"; }
            else if (h > 0) { label = `${h}p`; cls = "q-sd"; }

            const bitratePart = k > 0 ? `${k} kbps` : "";
            const text = label && bitratePart ? `${label} · ${bitratePart}` : (label || bitratePart);
            return { text, cls };
        }

        function getDeclaredLevelKbps() {
            if (hls && hls.levels && hls.currentLevel >= 0) {
                const bitrate = Number(hls.levels[hls.currentLevel]?.bitrate) || 0;
                if (bitrate > 0) return Math.round(bitrate / 1000);
            }
            return 0;
        }

        function showPlayerQualityBadge(height, kbps = 0, requestId = playRequestId) {
            if (!playerQualityBadge || requestId !== playRequestId) return;
            const h = Number(height) || video.videoHeight || 0;
            const k = Math.round(Number(kbps) || getDeclaredLevelKbps() || measuredStreamKbps || 0);
            const info = formatQualityInfo(h, k);
            if (!info) return;

            playerQualityBadge.textContent = info.text;
            playerQualityBadge.className = `player-quality-badge visible ${info.cls}`;
        }

        function detectVideoQuality(requestId = playRequestId) {
            if (requestId !== playRequestId) return;
            const level = hls && hls.levels && hls.currentLevel >= 0 ? hls.levels[hls.currentLevel] : null;
            const height = video.videoHeight || level?.height || 0;
            const kbps = (level?.bitrate ? Math.round(level.bitrate / 1000) : 0) || measuredStreamKbps;
            if (height > 0 || kbps > 0) showPlayerQualityBadge(height, kbps, requestId);
        }

        function handleHlsFragLoaded(data, requestId) {
            if (requestId !== playRequestId || !data || !data.frag) return;
            const fragStats = data.frag.stats || {};
            const dataStats = data.stats || {};
            const bytes = Number(data.payload?.byteLength)
                || Number(fragStats.loaded)
                || Number(fragStats.total)
                || Number(dataStats.loaded)
                || Number(dataStats.total)
                || 0;
            const duration = Number(data.frag.duration) || 0;
            if (bytes > 0 && duration > 0.2) {
                const kbps = Math.round((bytes * 8) / (duration * 1000));
                if (kbps > 0 && kbps < 100000) {
                    measuredStreamKbps = kbps;
                    detectVideoQuality(requestId);
                }
            }
        }

        function startDecodedBitrateSampler(requestId) {
            clearInterval(bitratePollTimer);
            lastDecodedBytes = 0;
            lastDecodedTime = 0;
            bitratePollTimer = setInterval(() => {
                if (requestId !== playRequestId) {
                    clearInterval(bitratePollTimer);
                    bitratePollTimer = null;
                    return;
                }
                if (video.paused || video.ended) return;
                const vBytes = Number(video.webkitVideoDecodedByteCount) || 0;
                const aBytes = Number(video.webkitAudioDecodedByteCount) || 0;
                const totalBytes = vBytes + aBytes;
                const now = performance.now();
                if (totalBytes > 0) {
                    if (lastDecodedBytes > 0 && totalBytes > lastDecodedBytes && now > lastDecodedTime) {
                        const deltaSec = (now - lastDecodedTime) / 1000;
                        if (deltaSec >= 0.8) {
                            const kbps = Math.round(((totalBytes - lastDecodedBytes) * 8) / (deltaSec * 1000));
                            if (kbps > 0 && kbps < 100000 && !getDeclaredLevelKbps()) {
                                measuredStreamKbps = kbps;
                                detectVideoQuality(requestId);
                            }
                        }
                    }
                    lastDecodedBytes = totalBytes;
                    lastDecodedTime = now;
                }
            }, 2000);
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
            const total = Math.floor(seconds);
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
            return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function getSeekableRange() {
            try {
                if (!video.seekable || video.seekable.length === 0) return null;
                const start = video.seekable.start(0);
                const end = video.seekable.end(video.seekable.length - 1);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
                return { start, end };
            } catch (_) { return null; }
        }

        function updateTimeLabels() {
            const range = getSeekableRange();
            if (range) {
                currentTimeEl.textContent = formatTime(Math.max(0, video.currentTime - range.start));
                durationTimeEl.textContent = formatTime(range.end - range.start);
            } else {
                currentTimeEl.textContent = formatTime(video.currentTime);
                durationTimeEl.textContent = "LIVE";
            }
        }

        function setProgressVisual(percent) {
            const value = Math.max(0, Math.min(100, Number(percent) || 0));
            progress.value = value;
            progress.style.background = `linear-gradient(to right, #ef4444 0%, #ef4444 ${value}%, #30382b ${value}%, #30382b 100%)`;
        }

        function updateProgressState() {
            const range = getSeekableRange();
            if (!range) {
                progressSeekable = false;
                progress.classList.add("live-only");
                setProgressVisual(100);
                updateTimeLabels();
                return;
            }
            progressSeekable = true;
            progress.classList.remove("live-only");
            const windowDuration = range.end - range.start;
            const position = Math.max(0, Math.min(windowDuration, video.currentTime - range.start));
            const percent = windowDuration > 0 ? (position / windowDuration) * 100 : 100;
            setProgressVisual(percent);
            updateTimeLabels();
        }

        document.addEventListener("visibilitychange", () => {
            if (!hls) return;
            if (document.hidden) {
                try { hls.stopLoad(); } catch (_) {}
            } else if (!video.paused) {
                try { hls.startLoad(); } catch (_) {}
            }
        });

        window.addEventListener("DOMContentLoaded", () => {
            setupEventListeners();
            loadPlaylist();
        });

        async function playDirectM3U8(url) {
            const requestId = ++playRequestId;
            const directUrl = String(url || "").trim();

            if (!directUrl) { alert("⚠️ Vui lòng nhập link M3U8."); return; }
            if (!/^https?:\/\//i.test(directUrl)) { alert("⚠️ Link M3U8 phải bắt đầu bằng http:// hoặc https://"); return; }

            if (hls) {
                try { hls.stopLoad(); } catch (_) {}
                try { hls.destroy(); } catch (_) {}
                hls = null;
            }
            try { video.pause(); } catch (_) {}
            video.removeAttribute("src");
            try { video.load(); } catch (_) {}
            resetPlayerQualityBadge();
            if (requestId !== playRequestId) return;
            startDecodedBitrateSampler(requestId);

            currentChannelIndex = -1;
            document.querySelectorAll(".channel.active").forEach(el => el.classList.remove("active"));
            activeChannelLogo.removeAttribute("src");
            activeChannelLogo.style.display = "none";
            playerTitle.textContent = "M3U8 STREAMING...";
            playerTitle.classList.remove("title-hidden");

            playerOverlay.style.color = "#88937d";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = "ĐANG TẢI LINK M3U8.....";

            progressSeekable = false;
            progress.classList.add("live-only");
            progress.value = 100;
            setProgressVisual(100);
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "LIVE";

            showVideoControls();

            return new Promise((resolve, reject) => {
                let settled = false;
                const resolveOnce = () => {
                    if (settled || requestId !== playRequestId) return;
                    settled = true;
                    playerOverlay.classList.add("hidden");
                    updatePlayButton();
                    resolve();
                };
                const rejectOnce = (err) => {
                    if (settled || requestId !== playRequestId) return;
                    settled = true;
                    console.error("Lỗi phát link M3U8:", err);
                    playerOverlay.style.color = "#f87171";
                    playerOverlay.classList.remove("hidden");
                    playerOverlay.textContent = "LINK M3U8 KHÔNG PHÁT ĐƯỢC! VUI LÒNG KIỂM TRA LINK!";
                    updatePlayButton();
                    reject(err);
                };

                if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.src = directUrl;
                    video.play().then(resolveOnce).catch(rejectOnce);
                    return;
                }
                if (window.Hls && Hls.isSupported()) {
                    hls = new Hls(LOW_END_HLS_CONFIG);
                    if (requestId !== playRequestId) {
                        try { hls.destroy(); } catch (_) {}
                        hls = null;
                        reject(new Error("Yêu cầu phát đã bị thay thế."));
                        return;
                    }
                    hls.loadSource(directUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (requestId !== playRequestId) return;
                        video.play().then(resolveOnce).catch(rejectOnce);
                    });
                    hls.on(Hls.Events.LEVEL_SWITCHED, (_event, data) => {
                        if (requestId !== playRequestId || !hls) return;
                        const level = hls.levels && hls.levels[data.level];
                        const kbps = level?.bitrate ? Math.round(level.bitrate / 1000) : measuredStreamKbps;
                        if (level?.height || kbps) showPlayerQualityBadge(level?.height || 0, kbps, requestId);
                    });
                    hls.on(Hls.Events.FRAG_LOADED, (_event, data) => handleHlsFragLoaded(data, requestId));
                    hls.on(Hls.Events.FRAG_BUFFERED, (_event, data) => handleHlsFragLoaded(data, requestId));
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (requestId !== playRequestId) return;
                        if (!data.fatal) return;
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            setTimeout(() => {
                                if (requestId !== playRequestId || !hls) return;
                                try { hls.startLoad(); } catch (_) {}
                            }, 800);
                            return;
                        }
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            try { hls.recoverMediaError(); } catch (_) { rejectOnce(data); }
                            return;
                        }
                        rejectOnce(data);
                    });
                    return;
                }
                video.src = directUrl;
                video.play().then(resolveOnce).catch(rejectOnce);
            });
        }

        async function loadPlaylist(sourceUrl = M3U_URL, signal = null, options = {}) {
            const { playLast = false, bustCache = false } = options;
            try {
                const fetchUrl = bustCache && !sourceUrl.includes("?")
                    ? `${sourceUrl}?_=${Date.now()}`
                    : sourceUrl;
                const response = await fetch(fetchUrl, { cache: "no-store", signal });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const text = await response.text();
                const parsedChannels = parseM3U(text);
                if (parsedChannels.length === 0) throw new Error("Playlist không có kênh");

                channels = parsedChannels;
                currentPlaylistUrl = sourceUrl;
                if (playLast) selectedChannelGroup = "__ALL__";
                updateChannelGroupFilter();
                renderChannels();

                if (playLast) {
                    playChannelByIndex(channels.length - 1, true, false);
                } else {
                    let defaultIndex = channels.findIndex(ch => ch.name.toUpperCase().includes("VTV6"));
                    if (defaultIndex === -1) defaultIndex = 0;
                    playChannelByIndex(defaultIndex, false, true);
                }
            } catch (error) {
                if (error?.name === "AbortError") return;
                console.error("PLAYLIST ERROR:", error);
                alert("❌ Không tải được link M3U này.\n\nHãy kiểm tra lại link, CORS hoặc playlist có đúng định dạng M3U/M3U8 hay không.");
                throw error;
            }
        }

        function parseM3U(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            let info = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.toUpperCase().startsWith("#EXTINF")) {
                    const comma = line.indexOf(",");
                    let name = comma >= 0 ? line.substring(comma + 1).trim() : "Kênh không tên";
                    const tvgName = getAttribute(line, "tvg-name");
                    if (tvgName) name = tvgName;

                    info = {
                        name,
                        logo: getAttribute(line, "tvg-logo"),
                        group: getAttribute(line, "group-title") || getAttribute(line, "tvg-group") || "Khác"
                    };
                    continue;
                }
                if (line.startsWith("#")) continue;
                if (info) {
                    result.push({ ...info, url: line });
                    info = null;
                }
            }
            return result;
        }

        function getAttribute(line, attribute) {
            const escaped = attribute.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
            const regex = new RegExp(escaped + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s,]+))', "i");
            const match = line.match(regex);
            return match ? (match[1] || match[2] || match[3] || "").trim() : "";
        }

        function updateChannelGroupFilter() {
            if (!channelGroupFilter) return;
            const groups = [...new Set(
                channels.map(channel => (channel.group || "Khác").trim()).filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, "vi"));

            channelGroupFilter.innerHTML = "";
            const allOption = document.createElement("option");
            allOption.value = "__ALL__";
            allOption.textContent = "Tất cả các kênh";
            channelGroupFilter.appendChild(allOption);

            groups.forEach(group => {
                const option = document.createElement("option");
                option.value = group;
                option.textContent = group;
                channelGroupFilter.appendChild(option);
            });

            if (groups.includes(selectedChannelGroup)) {
                channelGroupFilter.value = selectedChannelGroup;
            } else {
                selectedChannelGroup = "__ALL__";
                channelGroupFilter.value = "__ALL__";
            }
        }

        function getFilteredChannels() {
            if (selectedChannelGroup === "__ALL__") return channels;
            return channels.filter(channel => (channel.group || "Khác").trim() === selectedChannelGroup);
        }

        function renderChannels() {
            channelList.innerHTML = "";
            activeChannelCard = null;

            const filteredChannels = getFilteredChannels();
            channelCount.textContent = filteredChannels.length + " KÊNH";

            if (filteredChannels.length === 0) {
                channelList.innerHTML = '<div class="empty">Không có kênh trong nhóm này.</div>';
                return;
            }

            filteredChannels.forEach(channel => {
                const index = channels.indexOf(channel);
                const item = document.createElement("div");
                item.dataset.channelIndex = String(index);
                item.className = "channel" + (index === currentChannelIndex ? " active" : "");
                if (index === currentChannelIndex) activeChannelCard = item;

                const logoContainer = document.createElement("div");
                logoContainer.className = "channel-logo";
                const fallback = document.createElement("div");
                fallback.className = "logo-fallback";
                fallback.textContent = "📺";

                if (channel.logo) {
                    const img = document.createElement("img");
                    img.src = channel.logo;
                    img.alt = channel.name;
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.onerror = function () {
                        this.style.display = "none";
                        fallback.style.display = "flex";
                    };
                    logoContainer.appendChild(img);
                    fallback.style.display = "none";
                }
                logoContainer.appendChild(fallback);

                const info = document.createElement("div");
                info.className = "channel-info";
                const name = document.createElement("div");
                name.className = "channel-name";
                name.textContent = channel.name;
                info.appendChild(name);

                item.appendChild(logoContainer);
                item.appendChild(info);
                item.addEventListener("click", () => playChannelByIndex(index, true, false));
                channelList.appendChild(item);
            });
        }

        function playChannelByIndex(index, scrollToTop = true, isInitialAutoplay = false) {
            const requestId = ++playRequestId;

            if (hls) {
                try { hls.stopLoad(); } catch (_) {}
                try { hls.destroy(); } catch (_) {}
                hls = null;
            }
            try { video.pause(); } catch (_) {}
            video.removeAttribute("src");
            try { video.load(); } catch (_) {}
            resetPlayerQualityBadge();
            if (requestId !== playRequestId) return;
            if (index < 0 || index >= channels.length) return;
            startDecodedBitrateSampler(requestId);

            currentChannelIndex = index;
            const channel = channels[index];

            if (channel.logo) {
                activeChannelLogo.src = channel.logo;
                activeChannelLogo.style.display = "inline-block";
                activeChannelLogo.onerror = () => { activeChannelLogo.style.display = "none"; };
            } else {
                activeChannelLogo.style.display = "none";
            }

            if (activeChannelCard) activeChannelCard.classList.remove("active");
            activeChannelCard = channelList.querySelector(`.channel[data-channel-index="${index}"]`);
            if (activeChannelCard) activeChannelCard.classList.add("active");

            if (scrollToTop) window.scrollTo({ top: 0, behavior: "smooth" });

            video.pause();
            progressSeekable = false;
            progress.classList.add("live-only");
            progress.value = 100;
            setProgressVisual(100);
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "LIVE";

            if (isInitialAutoplay) {
                video.muted = true;
                unmuteBanner.classList.remove("hidden");
            } else if (!video.muted) {
                unmuteBanner.classList.add("hidden");
            }

            playerTitle.textContent = channel.name;
            playerTitle.classList.remove("title-hidden");

            playerOverlay.style.color = "#88937d";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = `ĐANG TẢI KÊNH ${channel.name}.....`;

            showVideoControls();

            const url = channel.url;

            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play().then(handlePlaySuccess).catch(handlePlayError);
            } else if (window.Hls && Hls.isSupported()) {
                hls = new Hls(LOW_END_HLS_CONFIG);
                if (requestId !== playRequestId) return;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (requestId !== playRequestId) return;
                    video.play().then(handlePlaySuccess).catch(handlePlayError);
                });
                hls.on(Hls.Events.LEVEL_SWITCHED, (_event, data) => {
                    if (requestId !== playRequestId || !hls) return;
                    const level = hls.levels && hls.levels[data.level];
                    const kbps = level?.bitrate ? Math.round(level.bitrate / 1000) : measuredStreamKbps;
                    if (level?.height || kbps) showPlayerQualityBadge(level?.height || 0, kbps, requestId);
                });
                hls.on(Hls.Events.FRAG_LOADED, (_event, data) => handleHlsFragLoaded(data, requestId));
                hls.on(Hls.Events.FRAG_BUFFERED, (_event, data) => handleHlsFragLoaded(data, requestId));
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (requestId !== playRequestId) return;
                    if (!data.fatal) return;
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        setTimeout(() => {
                            if (requestId !== playRequestId || !hls) return;
                            try { hls.startLoad(); } catch (_) {}
                        }, 800);
                        return;
                    }
                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        try { hls.recoverMediaError(); } catch (_) { handlePlayError(data); }
                        return;
                    }
                    handlePlayError(data);
                });
            } else {
                video.src = url;
                video.play().then(handlePlaySuccess).catch(handlePlayError);
            }
        }

        function handlePlaySuccess() {
            playerOverlay.classList.add("hidden");
            updatePlayButton();
        }

        function handlePlayError(err) {
            if (err && (err.name === "AbortError" || /play\(\).*interrupted.*pause\(\)/i.test(String(err.message || err)))) {
                return;
            }
            console.error("Lỗi phát luồng video:", err);
            playerOverlay.style.color = "#f87171";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = "KÊNH NÀY KHÔNG PHÁT ĐƯỢC! VUI LÒNG CHỌN KÊNH KHÁC!";
            updatePlayButton();
        }

        function updatePlayButton() {
            playBtn.textContent = video.paused ? "▶" : "⏸";
        }

        function toggleFullscreen() {
            const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
            if (!isFullscreen) {
                const elem = player;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {
                        if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
                    });
                } else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
                else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        let controlsHideTimer = null;
        const videoControls = document.querySelector(".video-controls");

        function showVideoControls() {
            if (!videoControls) return;
            clearTimeout(controlsHideTimer);
            player.classList.add("controls-active");
            videoControls.classList.remove("controls-hidden");
            if (playerTitle) playerTitle.classList.remove("title-hidden");
        }

        function hideVideoControls(delay = 1000) {
            if (!videoControls) return;
            clearTimeout(controlsHideTimer);
            controlsHideTimer = setTimeout(() => {
                if (!video.paused && !videoControls.matches(":hover")) {
                    videoControls.classList.add("controls-hidden");
                    player.classList.remove("controls-active");
                    if (playerTitle) playerTitle.classList.add("title-hidden");
                }
            }, delay);
        }

        // =========================================================
        // NO-SIGNAL DETECTION
        // Sau khi miniVideo bắn "playing", kiểm tra URL đích + HTTP status
        // + Content-Type + 4KB đầu body để phát hiện stream giả no-signal.
        // =========================================================
        const NO_SIGNAL_PATTERNS = [
            /no[-_\s]?signal/i,
            /signal[-_\s]?lost/i,
            /channel[-_\s]?(offline|dead|unavailable)/i,
            /stream[-_\s]?(not[-_\s]?found|offline|unavailable)/i,
            /not[-_\s]?available/i,
        ];

        function looksLikeNoSignal(text) {
            if (!text) return false;
            return NO_SIGNAL_PATTERNS.some(re => re.test(text));
        }

        async function readHead(response, maxBytes = 4096) {
            if (!response.body) return await response.text();
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let received = 0;
            let out = "";
            const readNext = async () => {
                if (received >= maxBytes) return;
                const { value, done } = await reader.read();
                if (done) return;
                received += value.byteLength;
                out += decoder.decode(value, { stream: true });
                if (received < maxBytes) await readNext();
            };
            try {
                await readNext();
            } catch (_) {}
            finally { try { reader.cancel(); } catch (_) {} }
            return out;
        }

        async function checkNoSignal(url, { timeoutMs = 8000 } = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const response = await fetch(url, {
                    redirect: "follow",
                    cache: "no-store",
                    signal: controller.signal,
                });
                const finalUrl = response.url || url;

                if (looksLikeNoSignal(finalUrl)) {
                    return { status: "no-signal", destination: finalUrl, reason: "final-url" };
                }
                if (!response.ok) {
                    return { status: "no-signal", destination: finalUrl, reason: "http-" + response.status };
                }

                const ct = (response.headers.get("content-type") || "").toLowerCase();
                const head = await readHead(response, 4096);

                if (looksLikeNoSignal(head)) {
                    return { status: "no-signal", destination: finalUrl, reason: "body" };
                }
                if (ct.includes("text/html")) {
                    return { status: "unknown", destination: finalUrl, reason: "html" };
                }
                if (head.trimStart().startsWith("#EXTM3U")) {
                    return { status: "ok", destination: finalUrl, reason: "extm3u" };
                }
                return { status: "unknown", destination: finalUrl, reason: "no-marker" };
            } catch (err) {
                if (err?.name === "AbortError") return { status: "unknown", destination: "", reason: "timeout" };
                return { status: "unknown", destination: "", reason: "network" };
            } finally {
                clearTimeout(timer);
            }
        }

        // =========================================================
        // DÒ KÊNH TRONG LIST M3U HIỆN TẠI (XEM KÊNH NÀO CÒN / HẾT)
        // =========================================================
        function openM3uChannelChecker() {
            ++playRequestId;
            if (hls) {
                try { hls.stopLoad(); } catch (_) {}
                try { hls.destroy(); } catch (_) {}
                hls = null;
            }
            try { video.pause(); } catch (_) {}
            video.removeAttribute("src");
            try { video.load(); } catch (_) {}
            resetPlayerQualityBadge();
            updatePlayButton();
            playerOverlay.classList.remove("hidden");
            playerOverlay.style.color = "#a8b19b";
            playerOverlay.textContent = "Trình phát đã tạm dừng khi mở công cụ dò kênh M3U.";

            const modal = document.createElement("div");
            modal.className = "scanner-modal";
            modal.innerHTML = `
                <section class="scanner-box" role="dialog" aria-modal="true" aria-label="Dò kênh trong list M3U">
                    <header class="scanner-head">
                        <div class="scanner-headline">
                            <h2>🔍 DÒ KÊNH TRONG LIST M3U</h2>
                            <button class="scanner-btn scanner-close" id="scannerClose" type="button" title="Đóng">✕</button>
                        </div>
                        <div class="scanner-toolbar">
                            <select class="scanner-group-select" id="scannerGroupSelect" title="Chọn nhóm kênh cần dò"></select>
                            <button class="scanner-btn primary" id="scannerTestAll" type="button">▶ DÒ KÊNH</button>
                            <button class="scanner-btn stop" id="scannerStop" type="button" disabled>⏹ DỪNG DÒ</button>
                            <button class="scanner-btn" id="scannerReset" type="button">↻ LÀM MỚI</button>
                        </div>
                    </header>
                    <div class="scanner-player">
                        <div class="scanner-player-title" id="scannerPlayerTitle">Trình phát thử kênh — sẵn sàng dò</div>
                        <video id="scannerVideo" controls playsinline preload="none"></video>
                        <div class="scanner-player-note" id="scannerPlayerNote">Bấm "▶ DÒ KÊNH" để kiểm tra kênh nào còn xem được, kênh nào đã hết.</div>
                    </div>
                    <div class="scanner-summary" id="scannerSummary">Đang chuẩn bị danh sách kênh...</div>
                    <div class="scanner-progress-wrap"><div class="scanner-progress-bar" id="scannerProgressBar"></div></div>
                    <div class="scanner-filter-bar" id="scannerFilterBar">
                        <button class="scanner-filter-btn active" type="button" data-filter="all">Tất cả (0)</button>
                        <button class="scanner-filter-btn" type="button" data-filter="alive">✅ Còn (0)</button>
                        <button class="scanner-filter-btn" type="button" data-filter="dead">🔴 Hết / Lỗi (0)</button>
                        <button class="scanner-filter-btn" type="button" data-filter="pending">⏳ Chưa dò (0)</button>
                    </div>
                    <div class="scanner-results" id="scannerResults"></div>
                </section>`;
            document.body.appendChild(modal);

            const groupSelect = modal.querySelector("#scannerGroupSelect");
            const startBtn = modal.querySelector("#scannerTestAll");
            const stopBtn = modal.querySelector("#scannerStop");
            const resetBtn = modal.querySelector("#scannerReset");
            const summary = modal.querySelector("#scannerSummary");
            const progressBar = modal.querySelector("#scannerProgressBar");
            const filterBar = modal.querySelector("#scannerFilterBar");
            const results = modal.querySelector("#scannerResults");
            const miniVideo = modal.querySelector("#scannerVideo");
            const miniTitle = modal.querySelector("#scannerPlayerTitle");
            const miniNote = modal.querySelector("#scannerPlayerNote");

            const items = channels.map((ch, idx) => ({
                index: idx,
                name: ch.name || ("Kênh #" + (idx + 1)),
                group: (ch.group || "Khác").trim() || "Khác",
                url: ch.url,
                state: "pending", // "pending" | "checking" | "alive" | "dead"
                verified: false,
                statusText: "Chưa dò",
                statusClass: "",
                rowEl: null,
                statusEl: null,
                testBtnEl: null
            }));

            let activeGroup = "__ALL__";
            let activeFilter = "all";
            let running = false;
            let stopRequested = false;
            let miniHls = null;
            let miniPlayRequest = 0;
            let activeCancelResolver = null;

            function stopMiniPlayer(cancelledMessage = null) {
                miniPlayRequest++;
                if (activeCancelResolver) {
                    const resolver = activeCancelResolver;
                    activeCancelResolver = null;
                    resolver({ playable: false, cancelled: true, message: cancelledMessage || "Đã dừng." });
                }
                if (miniHls) { try { miniHls.destroy(); } catch (_) {} miniHls = null; }
                try { miniVideo.pause(); } catch (_) {}
                miniVideo.removeAttribute("src");
                try { miniVideo.load(); } catch (_) {}
            }

            function playMiniLink(url, label) {
                stopMiniPlayer("Đã chuyển sang kênh khác.");
                const request = miniPlayRequest;
                miniTitle.textContent = "Đang dò: " + label;
                miniNote.textContent = "Đang kết nối luồng phát...";

                return new Promise((resolve) => {
                    let settled = false;
                    let timer = null;

                    const cleanup = () => {
                        if (timer) clearTimeout(timer);
                        miniVideo.removeEventListener("playing", onPlaying);
                        miniVideo.removeEventListener("error", onVideoError);
                        if (activeCancelResolver === finish) activeCancelResolver = null;
                    };
                    const finish = (result) => {
                        if (settled) return;
                        settled = true;
                        cleanup();
                        resolve(result);
                    };
                    activeCancelResolver = finish;

                    const onPlaying = async () => {
                        if (request !== miniPlayRequest) {
                            return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                        }
                        miniNote.textContent = "🔍 Đang xác minh tín hiệu...";
                        const check = await checkNoSignal(url, { timeoutMs: 5000 });
                        if (request !== miniPlayRequest) {
                            return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                        }
                        if (check.status === "no-signal") {
                            miniNote.textContent = `🔴 Không tín hiệu (${check.reason})`;
                            return finish({
                                playable: false,
                                noSignal: true,
                                message: "không tín hiệu (" + check.reason + ")"
                            });
                        }
                        miniNote.textContent = check.status === "ok"
                            ? "✅ Kênh đang phát bình thường."
                            : "🟡 Kênh phát được (CORS chặn kiểm tra nội dung).";
                        return finish({
                            playable: true,
                            verified: check.status === "ok",
                            message: "Còn xem được"
                        });
                    };

                    const onVideoError = () => {
                        if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                        finish({ playable: false, message: "lỗi media" });
                    };

                    timer = setTimeout(() => {
                        if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                        miniNote.textContent = "⚠ Quá 10s không phát được.";
                        finish({ playable: false, message: "quá thời gian chờ (10s)" });
                    }, 10000);

                    miniVideo.addEventListener("playing", onPlaying);
                    miniVideo.addEventListener("error", onVideoError);
                    miniVideo.muted = true;

                    if (miniVideo.canPlayType("application/vnd.apple.mpegurl")) {
                        miniVideo.src = url;
                        miniVideo.play().catch(err => {
                            if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                            finish({ playable: false, message: err?.name === "NotAllowedError" ? "trình duyệt chặn tự phát" : (err?.message || "lỗi phát") });
                        });
                    } else if (window.Hls && Hls.isSupported()) {
                        miniHls = new Hls(LOW_END_HLS_CONFIG);
                        miniHls.loadSource(url);
                        miniHls.attachMedia(miniVideo);
                        miniHls.on(Hls.Events.MANIFEST_PARSED, () => {
                            if (request !== miniPlayRequest) return;
                            miniVideo.play().catch(err => {
                                if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                                finish({ playable: false, message: err?.name === "NotAllowedError" ? "trình duyệt chặn tự phát" : (err?.message || "lỗi phát") });
                            });
                        });
                        miniHls.on(Hls.Events.ERROR, (_event, data) => {
                            if (request !== miniPlayRequest || !data.fatal) return;
                            finish({ playable: false, message: data.details || data.type || "lỗi luồng" });
                        });
                    } else {
                        miniVideo.src = url;
                        miniVideo.play().catch(err => {
                            if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã dừng." });
                            finish({ playable: false, message: err?.message || "lỗi phát" });
                        });
                    }
                });
            }

            function getScopedItems() {
                if (activeGroup === "__ALL__") return items;
                return items.filter(it => it.group === activeGroup);
            }

            function updateItemUI(item) {
                if (!item.statusEl) return;
                item.statusEl.className = "scanner-status" + (item.statusClass ? " " + item.statusClass : "");
                item.statusEl.textContent = item.statusText;
                if (item.rowEl) {
                    const visible = activeFilter === "all"
                        || (activeFilter === "alive" && item.state === "alive")
                        || (activeFilter === "dead" && item.state === "dead")
                        || (activeFilter === "pending" && (item.state === "pending" || item.state === "checking"));
                    item.rowEl.style.display = visible ? "" : "none";
                }
            }

            function updateSummaryAndCounts() {
                const scoped = getScopedItems();
                const total = scoped.length;
                const alive = scoped.filter(it => it.state === "alive").length;
                const dead = scoped.filter(it => it.state === "dead").length;
                const checked = alive + dead;
                const pending = total - checked;

                const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
                progressBar.style.width = pct + "%";

                if (total === 0) {
                    summary.textContent = "Chưa có kênh nào trong danh sách M3U hiện tại.";
                } else {
                    summary.textContent = `Đã dò ${checked}/${total} kênh (${pct}%) · ✅ Còn: ${alive} · 🔴 Hết/Lỗi: ${dead} · ⏳ Chưa dò: ${pending}`;
                }

                filterBar.querySelector('[data-filter="all"]').textContent = `Tất cả (${total})`;
                filterBar.querySelector('[data-filter="alive"]').textContent = `✅ Còn (${alive})`;
                filterBar.querySelector('[data-filter="dead"]').textContent = `🔴 Hết / Lỗi (${dead})`;
                filterBar.querySelector('[data-filter="pending"]').textContent = `⏳ Chưa dò (${pending})`;
            }

            function applyFilterVisibility() {
                const scoped = getScopedItems();
                let visibleCount = 0;
                scoped.forEach(item => {
                    updateItemUI(item);
                    if (item.rowEl && item.rowEl.style.display !== "none") visibleCount++;
                });
                let emptyHint = results.querySelector(".scanner-filter-empty");
                if (scoped.length > 0 && visibleCount === 0) {
                    if (!emptyHint) {
                        emptyHint = document.createElement("div");
                        emptyHint.className = "scanner-empty scanner-filter-empty";
                        results.appendChild(emptyHint);
                    }
                    emptyHint.textContent = "Không có kênh nào thuộc trạng thái đang lọc.";
                } else if (emptyHint) {
                    emptyHint.remove();
                }
            }

            async function probeItem(item) {
                item.state = "checking";
                item.statusText = "⏳ Đang dò kênh...";
                item.statusClass = "";
                if (item.testBtnEl) {
                    item.testBtnEl.disabled = true;
                    item.testBtnEl.textContent = "ĐANG DÒ...";
                }
                updateItemUI(item);

                try {
                    const playback = await playMiniLink(item.url, item.name);
                    if (playback.cancelled) {
                        item.state = "pending";
                        item.verified = false;
                        item.statusText = "Chưa dò";
                        item.statusClass = "";
                    } else if (playback.playable) {
                        item.state = "alive";
                        item.verified = !!playback.verified;
                        item.statusText = playback.verified
                            ? "✅ CÒN XEM ĐƯỢC"
                            : "🟡 CÒN XEM ĐƯỢC (chưa xác minh tín hiệu)";
                        item.statusClass = playback.verified ? "ok" : "warn";
                    } else {
                        item.state = "dead";
                        item.verified = false;
                        item.statusText = `🔴 HẾT / KHÔNG XEM ĐƯỢC — ${playback.message || "không phát được"}`;
                        item.statusClass = "bad";
                    }
                } catch (err) {
                    item.state = "dead";
                    item.verified = false;
                    item.statusText = "🔴 HẾT / LỖI — " + String(err?.message || err);
                    item.statusClass = "bad";
                } finally {
                    if (item.testBtnEl) {
                        item.testBtnEl.disabled = running;
                        item.testBtnEl.textContent = "🔍 DÒ";
                    }
                    updateItemUI(item);
                    updateSummaryAndCounts();
                    applyFilterVisibility();
                }
            }

            function closeModal() {
                stopRequested = true;
                running = false;
                stopMiniPlayer("Đã đóng cửa sổ dò kênh.");
                document.removeEventListener("keydown", escHandler);
                modal.remove();
            }

            const escHandler = (e) => {
                if (e.key === "Escape" && document.body.contains(modal)) {
                    closeModal();
                }
            };
            document.addEventListener("keydown", escHandler);
            modal.querySelector("#scannerClose").addEventListener("click", closeModal);
            modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

            function populateGroups() {
                const groupNames = [...new Set(items.map(it => it.group))]
                    .sort((a, b) => a.localeCompare(b, "vi"));
                groupSelect.innerHTML = "";

                const allOpt = document.createElement("option");
                allOpt.value = "__ALL__";
                allOpt.textContent = `Tất cả nhóm (${items.length} kênh)`;
                groupSelect.appendChild(allOpt);

                groupNames.forEach(name => {
                    const count = items.filter(it => it.group === name).length;
                    const opt = document.createElement("option");
                    opt.value = name;
                    opt.textContent = `${name} (${count})`;
                    groupSelect.appendChild(opt);
                });

                if (selectedChannelGroup && groupNames.includes(selectedChannelGroup)) {
                    activeGroup = selectedChannelGroup;
                    groupSelect.value = activeGroup;
                } else {
                    activeGroup = "__ALL__";
                    groupSelect.value = "__ALL__";
                }
            }

            function renderList() {
                results.innerHTML = "";
                const scoped = getScopedItems();

                if (scoped.length === 0) {
                    results.innerHTML = '<div class="scanner-empty">Danh sách M3U hiện đang trống. Hãy tải một playlist M3U trước khi dò kênh.</div>';
                    startBtn.disabled = true;
                    resetBtn.disabled = true;
                    updateSummaryAndCounts();
                    return;
                }

                startBtn.disabled = running;
                resetBtn.disabled = running;

                const wrapper = document.createElement("section");
                wrapper.className = "scanner-group";

                scoped.forEach((item, pos) => {
                    const row = document.createElement("div");
                    row.className = "scanner-link";

                    const info = document.createElement("div");

                    const head = document.createElement("div");
                    head.className = "scanner-ch-head";
                    const nameEl = document.createElement("span");
                    nameEl.className = "scanner-ch-name";
                    nameEl.textContent = `${pos + 1}. ${item.name}`;
                    const groupBadge = document.createElement("span");
                    groupBadge.className = "scanner-ch-group";
                    groupBadge.textContent = item.group;
                    head.append(nameEl, groupBadge);

                    const urlEl = document.createElement("div");
                    urlEl.className = "scanner-url";
                    urlEl.textContent = item.url;

                    const statusEl = document.createElement("div");
                    statusEl.className = "scanner-status" + (item.statusClass ? " " + item.statusClass : "");
                    statusEl.textContent = item.statusText;

                    info.append(head, urlEl, statusEl);

                    const actions = document.createElement("div");
                    actions.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-content:start";

                    const testBtn = document.createElement("button");
                    testBtn.type = "button";
                    testBtn.className = "scanner-btn";
                    testBtn.textContent = "🔍 DÒ";
                    testBtn.disabled = running;
                    testBtn.addEventListener("click", async () => {
                        if (running) return;
                        await probeItem(item);
                    });

                    const watchBtn = document.createElement("button");
                    watchBtn.type = "button";
                    watchBtn.className = "scanner-btn watch";
                    watchBtn.textContent = "📺 XEM";
                    watchBtn.title = "Mở kênh này trên màn hình chính";
                    watchBtn.addEventListener("click", () => {
                        const targetIndex = item.index;
                        closeModal();
                        playChannelByIndex(targetIndex, true, false);
                    });

                    actions.append(testBtn, watchBtn);
                    row.append(info, actions);
                    wrapper.appendChild(row);

                    item.rowEl = row;
                    item.statusEl = statusEl;
                    item.testBtnEl = testBtn;
                });

                results.appendChild(wrapper);
                updateSummaryAndCounts();
                applyFilterVisibility();
            }

            function setControlsRunning(isRunning) {
                running = isRunning;
                startBtn.disabled = isRunning;
                stopBtn.disabled = !isRunning;
                resetBtn.disabled = isRunning;
                groupSelect.disabled = isRunning;
                getScopedItems().forEach(it => {
                    if (it.testBtnEl) it.testBtnEl.disabled = isRunning;
                });
            }

            startBtn.addEventListener("click", () => {
                if (running) return;
                const scoped = getScopedItems();
                if (scoped.length === 0) return;

                // Nếu tất cả kênh trong nhóm đã dò rồi thì reset để dò lại từ đầu
                let queue = scoped.filter(it => it.state === "pending");
                if (queue.length === 0) {
                    scoped.forEach(it => {
                        it.state = "pending";
                        it.verified = false;
                        it.statusText = "Chưa dò";
                        it.statusClass = "";
                        updateItemUI(it);
                    });
                    updateSummaryAndCounts();
                    applyFilterVisibility();
                    queue = scoped;
                }

                stopRequested = false;
                setControlsRunning(true);

                let cursor = 0;
                const finishBatch = () => {
                    stopMiniPlayer();
                    if (document.body.contains(modal)) {
                        setControlsRunning(false);
                        miniTitle.textContent = stopRequested
                            ? "Đã dừng dò kênh"
                            : "Hoàn tất dò kênh trong list M3U";
                        miniNote.textContent = stopRequested
                            ? "⏹ Bạn có thể bấm \"▶ DÒ KÊNH\" để dò tiếp các kênh còn lại."
                            : "✅ Đã dò xong! Dùng các nút lọc bên dưới để xem nhanh kênh còn / hết.";
                        updateSummaryAndCounts();
                    }
                };

                const processNext = async () => {
                    try {
                        if (stopRequested || !document.body.contains(modal) || cursor >= queue.length) {
                            finishBatch();
                            return;
                        }
                        const item = queue[cursor++];
                        if (item.rowEl && item.rowEl.style.display !== "none") {
                            item.rowEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
                        }
                        await probeItem(item);
                        if (stopRequested || !document.body.contains(modal) || cursor >= queue.length) {
                            finishBatch();
                            return;
                        }
                        setTimeout(processNext, 250);
                    } catch (_) {
                        finishBatch();
                    }
                };

                setTimeout(processNext, 0);
            });

            stopBtn.addEventListener("click", () => {
                if (!running) return;
                stopRequested = true;
                stopBtn.disabled = true;
                stopMiniPlayer("Đã dừng theo yêu cầu.");
            });

            resetBtn.addEventListener("click", () => {
                if (running) return;
                stopMiniPlayer();
                getScopedItems().forEach(it => {
                    it.state = "pending";
                    it.verified = false;
                    it.statusText = "Chưa dò";
                    it.statusClass = "";
                    updateItemUI(it);
                });
                miniTitle.textContent = "Trình phát thử kênh — đã làm mới";
                miniNote.textContent = "Bấm \"▶ DÒ KÊNH\" để bắt đầu dò lại từ đầu.";
                updateSummaryAndCounts();
                applyFilterVisibility();
            });

            groupSelect.addEventListener("change", () => {
                if (running) return;
                activeGroup = groupSelect.value || "__ALL__";
                renderList();
            });

            filterBar.addEventListener("click", (e) => {
                const btn = e.target.closest(".scanner-filter-btn");
                if (!btn) return;
                activeFilter = btn.dataset.filter || "all";
                filterBar.querySelectorAll(".scanner-filter-btn").forEach(b => {
                    b.classList.toggle("active", b === btn);
                });
                applyFilterVisibility();
            });

            populateGroups();
            renderList();
        }

        function setupEventListeners() {
            channelGroupFilter.addEventListener("change", () => {
                selectedChannelGroup = channelGroupFilter.value || "__ALL__";
                renderChannels();
                scrollToActiveChannelInList();
            });

            if (videoControls) {
                player.addEventListener("mouseenter", showVideoControls);
                player.addEventListener("mousemove", showVideoControls);
                player.addEventListener("mouseleave", () => {
                    if (!document.fullscreenElement && !document.webkitFullscreenElement && !video.paused) {
                        hideVideoControls(1000);
                    }
                });

                videoControls.addEventListener("mouseenter", showVideoControls);
                videoControls.addEventListener("mousemove", showVideoControls);
                videoControls.addEventListener("mouseleave", () => {
                    if (!video.paused) hideVideoControls(700);
                });

                document.addEventListener("mousemove", (e) => {
                    const isFullscreen = !!(
                        document.fullscreenElement ||
                        document.webkitFullscreenElement ||
                        document.mozFullScreenElement ||
                        document.msFullscreenElement
                    );
                    if (!isFullscreen) return;

                    const rect = player.getBoundingClientRect();
                    const insidePlayer =
                        e.clientX >= rect.left &&
                        e.clientX <= rect.right &&
                        e.clientY >= rect.top &&
                        e.clientY <= rect.bottom;

                    if (insidePlayer) {
                        showVideoControls();
                        if (!video.paused) hideVideoControls(1500);
                    }
                });

                document.addEventListener("fullscreenchange", showVideoControls);
                document.addEventListener("webkitfullscreenchange", showVideoControls);
            }

            video.addEventListener("play", () => hideVideoControls(1800));
            video.addEventListener("pause", showVideoControls);
            video.addEventListener("ended", showVideoControls);

            let progressUpdateTimer = null;
            const scheduleProgressUpdate = () => {
                if (progressUpdateTimer !== null) return;
                progressUpdateTimer = setTimeout(() => {
                    progressUpdateTimer = null;
                    updateProgressState();
                }, 250);
            };

            video.addEventListener("timeupdate", scheduleProgressUpdate);
            video.addEventListener("durationchange", scheduleProgressUpdate);
            video.addEventListener("loadedmetadata", scheduleProgressUpdate);
            video.addEventListener("loadeddata", scheduleProgressUpdate);
            video.addEventListener("canplay", scheduleProgressUpdate);
            video.addEventListener("progress", scheduleProgressUpdate);
            video.addEventListener("loadedmetadata", () => detectVideoQuality(playRequestId));
            video.addEventListener("resize", () => detectVideoQuality(playRequestId));
            video.addEventListener("playing", () => detectVideoQuality(playRequestId));

            progress.addEventListener("input", () => {
                const range = getSeekableRange();
                if (!progressSeekable || !range) return;
                const percent = Math.max(0, Math.min(100, Number(progress.value))) / 100;
                setProgressVisual(percent * 100);
                const previewTime = percent * (range.end - range.start);
                currentTimeEl.textContent = formatTime(previewTime);
            });

            let seekInProgress = false;
            let seekUnlockTimer = null;

            function performStableSeek() {
                if (seekInProgress) return;
                const range = getSeekableRange();
                if (!progressSeekable || !range) return;
                const percent = Math.max(0, Math.min(100, Number(progress.value))) / 100;
                const target = range.start + percent * (range.end - range.start);
                if (!Number.isFinite(target)) return;
                seekInProgress = true;
                video.currentTime = target;
                currentTimeEl.textContent = formatTime(target - range.start);
                clearTimeout(seekUnlockTimer);
                seekUnlockTimer = setTimeout(() => { seekInProgress = false; }, 1800);
            }

            video.addEventListener("seeked", () => {
                seekInProgress = false;
                clearTimeout(seekUnlockTimer);
                updateProgressState();
            });

            progress.addEventListener("change", performStableSeek);

            unmuteBanner.addEventListener("click", () => {
                video.muted = false;
                unmuteBanner.classList.add("hidden");
            });

            video.addEventListener("volumechange", () => {
                if (!video.muted) unmuteBanner.classList.add("hidden");
            });

            playBtn.addEventListener("click", () => {
                if (video.paused) video.play().catch(() => {});
                else video.pause();
            });

            video.addEventListener("play", updatePlayButton);
            video.addEventListener("pause", updatePlayButton);

            previousBtn.addEventListener("click", () => {
                const filteredChannels = getFilteredChannels();
                if (filteredChannels.length === 0) return;
                const currentPosition = filteredChannels.findIndex(channel => channel === channels[currentChannelIndex]);
                const prevPosition = (currentPosition - 1 + filteredChannels.length) % filteredChannels.length;
                const prevIndex = channels.indexOf(filteredChannels[prevPosition]);
                if (prevIndex !== -1) playChannelByIndex(prevIndex, true, false);
            });

            nextBtn.addEventListener("click", () => {
                const filteredChannels = getFilteredChannels();
                if (filteredChannels.length === 0) return;
                const currentPosition = filteredChannels.findIndex(channel => channel === channels[currentChannelIndex]);
                const nextPosition = (currentPosition + 1) % filteredChannels.length;
                const nextIndex = channels.indexOf(filteredChannels[nextPosition]);
                if (nextIndex !== -1) playChannelByIndex(nextIndex, true, false);
            });

            currentChannelBtn.addEventListener("click", scrollToActiveChannelInList);

            fullscreenBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleFullscreen();
            });

            calendarBtn.addEventListener("click", () => window.open(CALENDAR_URL, "_blank", "noopener,noreferrer"));
            cinemaxBtn.addEventListener("click", openM3uChannelChecker);
            downloadAppBtn.addEventListener("click", () => window.open(DOWNLOAD_APP_URL, "_blank", "noopener,noreferrer"));
            xosoBtn.addEventListener("click", () => window.open(XOSO_URL, "_blank", "noopener,noreferrer"));
            footballBtn.addEventListener("click", async () => {
                if (footballBtn.disabled) return;
                footballBtn.disabled = true;
                footballBtn.textContent = "⏳";
                try {
                    await loadPlaylist(currentPlaylistUrl || M3U_URL, null, { playLast: true, bustCache: true });
                } catch (_) {} finally {
                    footballBtn.disabled = false;
                    footballBtn.textContent = "⚽";
                }
            });

            channelCount.addEventListener("click", async () => {
                const modal = document.createElement("div");
                modal.className = "playlist-choice-modal";

                modal.innerHTML = `
                    <div class="playlist-choice-box">
                        <div class="playlist-choice-title">📺 NHẬP LINK .M3U HOẶC .M3U8</div>
                        <div class="playlist-choice-item">
                            <div class="playlist-choice-label">📋 LINK LIST .M3U</div>
                            <input id="m3uInput" class="playlist-choice-input" type="url"
                                placeholder="https://example.com/playlist.m3u"
                                value="${currentPlaylistUrl !== M3U_URL ? currentPlaylistUrl : ""}">
                            <button id="m3uOkBtn" class="playlist-choice-ok" type="button">OK</button>
                        </div>
                        <div class="playlist-choice-item">
                            <div class="playlist-choice-label">▶️ LINK .M3U8 STREAMING</div>
                            <input id="m3u8Input" class="playlist-choice-input" type="url"
                                placeholder="https://example.com/live/stream.m3u8">
                            <button id="m3u8OkBtn" class="playlist-choice-ok" type="button">OK</button>
                        </div>
                        <button id="playlistCancelBtn" class="playlist-choice-cancel" type="button">HỦY</button>
                    </div>
                `;

                document.body.appendChild(modal);

                const m3uInput = modal.querySelector("#m3uInput");
                const m3u8Input = modal.querySelector("#m3u8Input");
                const m3uOkBtn = modal.querySelector("#m3uOkBtn");
                const m3u8OkBtn = modal.querySelector("#m3u8OkBtn");
                const cancelBtn = modal.querySelector("#playlistCancelBtn");

                const closeModal = () => modal.remove();
                cancelBtn.addEventListener("click", closeModal);
                modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

                m3uOkBtn.addEventListener("click", async () => {
                    const tempUrl = m3uInput.value.trim();
                    if (!tempUrl) { alert("⚠️ Vui lòng nhập link M3U."); m3uInput.focus(); return; }
                    if (!/^https?:\/\//i.test(tempUrl)) { alert("⚠️ Link M3U phải bắt đầu bằng http:// hoặc https://"); m3uInput.focus(); return; }
                    m3uOkBtn.disabled = true;
                    m3uOkBtn.textContent = "ĐANG TẢI...";
                    try {
                        await loadPlaylist(tempUrl);
                        closeModal();
                    } catch (_) {} finally {
                        m3uOkBtn.disabled = false;
                        m3uOkBtn.textContent = "OK";
                    }
                });

                m3u8OkBtn.addEventListener("click", async () => {
                    const directUrl = m3u8Input.value.trim();
                    if (!directUrl) { alert("⚠️ Vui lòng nhập link M3U8."); m3u8Input.focus(); return; }
                    if (!/^https?:\/\//i.test(directUrl)) { alert("⚠️ Link M3U8 phải bắt đầu bằng http:// hoặc https://"); m3u8Input.focus(); return; }
                    m3u8OkBtn.disabled = true;
                    m3u8OkBtn.textContent = "ĐANG PHÁT...";
                    try {
                        await playDirectM3U8(directUrl);
                        closeModal();
                    } finally {
                        m3u8OkBtn.disabled = false;
                        m3u8OkBtn.textContent = "OK";
                    }
                });

                m3uInput.addEventListener("keydown", (e) => { if (e.key === "Enter") m3uOkBtn.click(); });
                m3u8Input.addEventListener("keydown", (e) => { if (e.key === "Enter") m3u8OkBtn.click(); });
                setTimeout(() => m3uInput.focus(), 0);
            });

            document.addEventListener("keydown", (e) => {
                if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
                switch (e.key) {
                    case "ArrowLeft":
                        e.preventDefault();
                        previousBtn.click();
                        break;
                    case "ArrowRight":
                        e.preventDefault();
                        nextBtn.click();
                        break;
                    case "f":
                    case "F":
                        e.preventDefault();
                        toggleFullscreen();
                        break;
                    case "x":
                    case "X":
                        e.preventDefault();
                        scrollToActiveChannelInList();
                        break;
                    case "h":
                    case "H":
                        e.preventDefault();
                        window.scrollTo({ top: 0, behavior: "smooth" });
                        break;
                }
            });
        }

        function getActiveChannelElement() {
            return Array.from(document.querySelectorAll(".channel")).find(el => el.classList.contains("active")) || null;
        }

        function scrollToActiveChannelInList() {
            const activeChannel = getActiveChannelElement();
            if (!activeChannel) return;
            activeChannel.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
        }
    </script>
</body>

</html>
