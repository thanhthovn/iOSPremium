<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XEM TIVI Ở NHÀ</title>

    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="XEM TIVI Ở NHÀ">

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        :root {
            --logo-size: 250px;
            --channel-name-size: 30px;
            --grid-gap: 15px;
            --military-black: #0b1009;
            --military-dark: #11180e;
            --military-green: #263b20;
            --military-green-2: #344d28;
            --military-light: #536a3c;
            --military-border: #465838;
            --accent: #82964c;
            --text-main: #f0f2e9;
            --text-muted: #a8b19b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        html, body {
            width: 100%; min-height: 100%;
            font-family: sans-serif, Arial, Helvetica;
            color: var(--text-main);
            background: var(--military-black);
        }

        body::before {
            content: ""; position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(83,106,60,.42) 0 10%, transparent 32%),
                radial-gradient(ellipse at 80% 15%, rgba(52,77,40,.50) 0 12%, transparent 35%),
                radial-gradient(ellipse at 60% 70%, rgba(104,115,74,.24) 0 11%, transparent 34%),
                radial-gradient(ellipse at 20% 85%, rgba(38,59,32,.60) 0 15%, transparent 40%),
                linear-gradient(135deg, #0b1009, #1c2817 35%, #11180e 70%, #28381f);
        }

        .container { width: 100%; max-width: 1700px; margin: auto; padding: 18px; }
        .layout { display: flex; flex-direction: column; gap: 18px; }
        .player-wrapper { width: 100%; order: 1; }

        .player {
            position: relative; width: 100%; aspect-ratio: 16 / 9;
            background: #000; border-radius: 9px; overflow: hidden;
            border: 2px solid var(--military-border);
            box-shadow: 0 8px 25px rgba(0,0,0,.5);
        }

        .player:fullscreen, .player:-webkit-full-screen, .player:-moz-full-screen, .player:-ms-fullscreen {
            width: 100vw !important; height: 100vh !important;
            max-width: none !important; max-height: none !important;
            border: none !important; border-radius: 0 !important;
            background: #000 !important; display: flex !important;
            justify-content: center !important; align-items: center !important;
        }

        video { width: 100%; height: 100%; display: block; background: #000; object-fit: contain; }

        .player-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #f87171; font-size: 16px; font-weight: bold;
            pointer-events: none; z-index: 2; background: rgba(0,0,0,0.7);
            text-align: center; padding: 20px;
        }
        .player-overlay.hidden { display: none; }

        #programTitle {
            font-weight: normal; color: red; font-size: 0.75em; line-height: 1.2;
            text-align: right; -webkit-text-stroke: 0.25px gold;
        }

        .player-title {
            position: absolute; top: 14px; right: 16px; z-index: 15;
            color: #ffffff; font-size: 16px; font-weight: bold; letter-spacing: 0.5px;
            padding: 6px 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
            opacity: 1; transform: translateY(0);
            transition: opacity .25s ease, transform .25s ease;
            pointer-events: none;
        }
        .player-title.title-hidden { opacity: 0; transform: translateY(-10px); }

        .unmute-banner {
            position: absolute !important; top: 12px !important; left: 12px !important;
            right: auto !important; bottom: auto !important; z-index: 100 !important;
            background: rgba(220, 38, 38, 0.94); color: #fff; padding: 8px 12px;
            border: 1px solid rgba(255,255,255,.2); border-radius: 6px;
            font-size: 13px; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,.35); white-space: nowrap;
        }
        .unmute-banner.hidden { display: none; }

        .video-controls {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
            padding: 10px 12px 11px;
            background: linear-gradient(to top, rgba(5,8,4,.98), rgba(5,8,4,.88), transparent);
            transition: opacity .25s ease, transform .25s ease;
        }
        .video-controls.controls-hidden {
            opacity: 0; transform: translateY(100%); pointer-events: none;
        }
        .player.controls-active .video-controls {
            opacity: 1; transform: translateY(0); pointer-events: auto;
        }

        .progress-row { width: 100%; margin-bottom: -95px; }
        .progress-time-row { display: flex; align-items: center; gap: 8px; width: 100%; }

        .progress-time {
            flex: 0 0 auto; min-width: 42px; color: #ffffff; font-size: 11px; line-height: 1;
            font-variant-numeric: tabular-nums; text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,.8);
        }

        .progress {
            flex: 1 1 auto; min-width: 0; width: auto; height: 6px;
            appearance: none; -webkit-appearance: none; cursor: pointer;
            background: linear-gradient(to right, #ef4444 0%, #ef4444 0%, #30382b 0%, #30382b 100%);
            border-radius: 10px; outline: none;
        }
        .progress.live-only { cursor: default; opacity: .85; }

        .progress::-webkit-slider-thumb {
            appearance: none; -webkit-appearance: none; width: 14px; height: 14px;
            border-radius: 50%; background: #263b20; border: 2px solid #536a3c; cursor: pointer;
        }
        .progress::-moz-range-thumb {
            width: 14px; height: 14px; border: 2px solid #536a3c; border-radius: 50%;
            background: #263b20; cursor: pointer;
        }

        .control-row { display: flex; align-items: center; gap: 12px; width: 100%; }
        .standalone-logo {
            width: 100px; height: 100px; object-fit: contain;
            padding: 4px; display: none; flex-shrink: 0;
        }

        .control-btn {
            width: 40px; height: 36px; flex-shrink: 0;
            border: 1px solid rgba(126,148,82,.45); border-radius: 6px;
            background: rgba(38,59,32,.92); color: white;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 17px;
            transition: background .15s, transform .15s;
        }
        .control-btn:hover { background: var(--military-light); }
        .control-btn:active { transform: scale(.94); }

        .play-btn {
            width: 44px; font-size: 19px;
            background: #a51f1f; border-color: #d13a3a;
        }
        .play-btn:hover { background: #c52b2b; border-color: #e14a4a; }

        .current-channel-btn { color: #82c341; font-size: 20px; font-weight: bold; }
        .current-channel-btn:hover { color: #a6e063; }

        .control-spacer { flex: 1; }

        .panel {
            width: 100%; order: 2; background: rgba(17,24,14,.96);
            border: 2px solid var(--military-border); border-radius: 9px;
            overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,.35);
        }

        .panel-header {
            padding: 13px 15px;
            background: linear-gradient(135deg, #263b20, #11180e);
            border-bottom: 1px solid var(--military-border);
        }

        .panel-title {
            display: flex; align-items: center; justify-content: flex-start;
            flex-wrap: nowrap; gap: 10px;
        }
        .panel-title h2 { flex-shrink: 0; white-space: nowrap; font-size: 15px; }

        .channel-group-filter {
            width: 300px; min-width: 60px; max-width: 300px; height: 34px;
            padding: 0 6px; border: 1px solid #d13a3a; border-radius: 6px;
            background: #182314; color: var(--text-main);
            font-family: sans-serif, Arial, Helvetica; font-size: 18px;
            outline: none; cursor: pointer; flex-shrink: 0;
        }
        .channel-group-filter:hover, .channel-group-filter:focus { border-color: var(--military-light); }
        .channel-group-filter option { background: #182314; color: var(--text-main); }

        .calendar-btn, .cinemax-btn {
            height: 34px; padding: 0 14px;
            border: 1px solid #d13a3a; border-radius: 6px;
            background: #11180e; color: #ffffff;
            font-family: sans-serif, Arial, Helvetica;
            font-size: 16px; font-weight: bold; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
            transition: background .15s, transform .15s, border-color .15s;
        }
        .calendar-btn:hover, .cinemax-btn:hover { background: #c52b2b; border-color: #ef4444; }
        .calendar-btn:active, .cinemax-btn:active { transform: scale(.96); }

        .channel-count {
            color: #ffffff; font-size: 16px; font-weight: bold;
            margin-left: auto; white-space: nowrap; height: 34px; padding: 0 14px;
            border: 1px solid #d13a3a; border-radius: 6px;
            background: #11180e; cursor: pointer;
            transition: background .15s, transform .15s, border-color .15s;
        }
        .channel-count:hover { background: #c52b2b; border-color: #ef4444; }
        .channel-count:active { transform: scale(.96); }
        .channel-count:focus-visible { outline: 2px solid #ef4444; outline-offset: 2px; }
        .channel-count:disabled { opacity: .65; cursor: wait; }
        .channel-count.import-btn:hover { background: #991b1b; }

        .channel-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: var(--grid-gap); padding: 16px;
        }

        .channel {
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; gap: 12px; min-height: 220px;
            padding: 16px 25px; border-radius: 12px; cursor: pointer;
            transition: background .15s ease, transform .15s ease, border-color .15s ease;
            border: 2px solid transparent;
        }
        .channel:hover {
            background: rgba(83,106,60,.35);
            border-color: var(--military-light);
            transform: translateY(-2px);
        }
        .channel.active {
            background: linear-gradient(135deg, #7f1d1d, #450a0a) !important;
            border: 2px solid #ef4444 !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .channel-logo {
            width: var(--logo-size); height: var(--logo-size);
            min-width: var(--logo-size); min-height: var(--logo-size);
            flex-shrink: 0; border-radius: 12px; background: #20291b;
            border: 1px solid #52633d; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(0,0,0,.4);
        }
        .channel-logo img {
            width: 100%; height: 100%; object-fit: contain;
            padding: 8px; display: block;
        }

        .logo-fallback {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            font-size: 50px;
        }

        .channel-info { width: 100%; min-width: 0; text-align: center; }
        .channel-name {
            font-size: var(--channel-name-size); font-weight: 700; line-height: 1.2;
            text-align: center; overflow-wrap: anywhere;
        }

        .empty, .loading {
            padding: 30px 10px; text-align: center;
            color: #77826d; font-size: 12px;
            grid-column: 1 / -1;
        }

        /* ============ MODAL NHẬP LINK M3U / M3U8 ============ */
        .playlist-choice-modal {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            padding: 18px; background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(4px);
        }
        .playlist-choice-box {
            width: min(520px, 100%); padding: 20px;
            border: 2px solid var(--military-border); border-radius: 12px;
            background: linear-gradient(145deg, #182314, #0b1009);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.65);
        }
        .playlist-choice-title {
            margin-bottom: 18px; color: #ffffff; font-size: 19px;
            font-weight: 700; text-align: center;
        }
        .playlist-choice-item {
            display: grid; grid-template-columns: 1fr auto;
            gap: 8px; margin-bottom: 14px;
        }
        .playlist-choice-label {
            grid-column: 1 / -1; color: #ffffff;
            font-size: 14px; font-weight: 700;
        }
        .playlist-choice-input {
            width: 100%; min-width: 0; height: 42px; padding: 0 12px;
            border: 1px solid #d13a3a; border-radius: 6px;
            outline: none; background: #11180e; color: #ffffff;
            font-family: sans-serif, Arial, Helvetica; font-size: 14px;
        }
        .playlist-choice-input::placeholder { color: #77826d; }
        .playlist-choice-input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.15);
        }
        .playlist-choice-ok {
            width: 70px; height: 42px;
            border: 1px solid #d13a3a; border-radius: 6px;
            background: #a51f1f; color: #ffffff;
            font-size: 14px; font-weight: 700; cursor: pointer;
        }
        .playlist-choice-ok:hover { background: #c52b2b; border-color: #ef4444; }
        .playlist-choice-ok:disabled { opacity: 0.65; cursor: wait; }
        .playlist-choice-cancel {
            width: 100%; height: 38px; margin-top: 4px;
            border: 1px solid var(--military-border); border-radius: 6px;
            background: #263b20; color: #ffffff;
            font-size: 13px; font-weight: 700; cursor: pointer;
        }
        .playlist-choice-cancel:hover { background: #536a3c; }

        /* ============ IPTV SCANNER ============ */
        .scanner-modal {
            position: fixed; inset: 0; z-index: 10000; display: flex;
            align-items: center; justify-content: center; padding: 14px;
            background: rgba(0,0,0,.82); backdrop-filter: blur(5px);
        }
        .scanner-box {
            width: min(1050px, 100%); max-height: 92vh; display: flex;
            flex-direction: column; overflow: hidden;
            border: 2px solid var(--military-border); border-radius: 12px;
            background: #10170d; box-shadow: 0 18px 55px #000b;
        }
        .scanner-head {
            padding: 15px; background: linear-gradient(135deg,#263b20,#11180e);
            border-bottom: 1px solid var(--military-border);
        }
        .scanner-headline {
            display:flex; align-items:center; justify-content:space-between;
            gap:12px; flex-wrap:wrap;
        }
        .scanner-headline h2 { font-size:18px; color:#fff; }
        .scanner-subtitle {
            margin-top:7px; color:var(--text-muted);
            font-size:12px; line-height:1.5;
        }
        .scanner-toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .scanner-btn {
            border:1px solid #536a3c; border-radius:6px; padding:9px 12px;
            color:#fff; background:#263b20; font-weight:700; cursor:pointer;
        }
        .scanner-btn:hover { background:#536a3c; }
        .scanner-btn.primary { background:#a51f1f; border-color:#d13a3a; }
        .scanner-btn:disabled { opacity:.55; cursor:wait; }
        .scanner-player {
            padding:12px 15px; border-bottom:1px solid #34452a; background:#080b07;
        }
        .scanner-player-title {
            color:#d9e8c5; font-size:13px; font-weight:700;
            margin-bottom:8px; overflow-wrap:anywhere;
        }
        .scanner-player video {
            display:block; width:min(100%,560px); aspect-ratio:16/9;
            height:auto; max-height:42vh; margin:0 auto; background:#000;
            border:1px solid #465838; border-radius:7px;
        }
        .scanner-player-note {
            margin-top:7px; color:var(--text-muted);
            font-size:11px; text-align:center;
        }
        .scanner-summary {
            padding:10px 15px; border-bottom:1px solid #34452a;
            color:#e5e7eb; font-size:13px;
        }
        .scanner-results { overflow:auto; padding:12px; }
        .scanner-group {
            margin-bottom:12px; border:1px solid #34452a;
            border-radius:8px; overflow:hidden;
        }
        .scanner-group-title {
            padding:10px 12px; background:#1c2916;
            color:#d9e8c5; font-weight:700; overflow-wrap:anywhere;
        }
        .scanner-link {
            display:grid; grid-template-columns:minmax(0,1fr) auto;
            gap:10px; align-items:center; padding:10px 12px;
            border-top:1px solid #283722;
        }
        .scanner-url {
            min-width:0; overflow-wrap:anywhere;
            color:#d1d5db; font-size:12px; line-height:1.45;
        }
        .scanner-destination {
            margin-top:5px; color:#9ca3af; font-size:11px;
            line-height:1.4; overflow-wrap:anywhere;
        }
        .scanner-destination strong { color:#fbbf24; }
        .scanner-status {
            margin-top:4px; font-size:12px; color:#a8b19b;
        }
        .scanner-status.ok { color:#86efac; }
        .scanner-status.bad { color:#fca5a5; }
        .scanner-status.warn { color:#fcd34d; }
        .scanner-empty {
            padding:22px; text-align:center;
            color:#fcd34d; line-height:1.6;
        }
        .scanner-close {
            font-size:20px; line-height:1; padding:6px 10px;
        }
        @media(max-width:600px) {
            .scanner-box { max-height:95vh; }
            .scanner-headline h2 { font-size:15px; }
            .scanner-link { grid-template-columns:minmax(0,1fr); }
            .scanner-link .scanner-btn { justify-self:start; }
        }

        @media (max-width: 600px) {
            .unmute-banner {
                top: 8px !important; left: 8px !important;
                right: auto !important; bottom: auto !important;
                font-size: 12px; padding: 7px 10px;
            }
            .container { padding: 9px; }
            .channel-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px; padding: 8px;
            }
            .channel { min-height: 180px; padding: 10px 5px; }
            .channel-logo {
                width: 110px; height: 110px;
                min-width: 110px; min-height: 110px;
            }
            .channel-name { font-size: 18px; }
            .control-btn { width: 35px; height: 34px; }
            .standalone-logo { width: 50px; height: 50px; }
        }

        @media (max-width: 520px) {
            .panel-title { flex-wrap: wrap; gap: 6px; }
            .panel-title h2 { font-size: 13px; }
            .channel-group-filter {
                width: 100%; min-width: 0; max-width: 100%;
                font-size: 11px; flex: 1 1 100%;
            }
            .channel-count { font-size: 11px; padding: 0 10px; }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="layout">
            <section class="player-wrapper">
                <div id="player" class="player">
                    <video id="video" playsinline preload="metadata"></video>

                    <div id="playerTitle" class="player-title">
                        <div id="programTitle">Thánh Thơ © 2026</div>
                    </div>

                    <div id="playerOverlay" class="player-overlay">
                        Đang tải danh sách kênh.....
                    </div>

                    <div id="unmuteBanner" class="unmute-banner hidden">
                        🔊 [BẬT ÂM THANH]
                    </div>

                    <div class="video-controls">
                        <div class="progress-row">
                            <div class="progress-time-row">
                                <span id="currentTime" class="progress-time">00:00</span>
                                <input id="progress" class="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Tiến trình phát">
                                <span id="durationTime" class="progress-time">00:00</span>
                            </div>
                        </div>

                        <div class="control-row">
                            <img id="activeChannelLogo" class="standalone-logo" src="" alt="Logo">
                            <button id="previousBtn" class="control-btn" type="button" title="Kênh trước">⏮</button>
                            <button id="playBtn" class="control-btn play-btn" type="button" title="Phát / Tạm dừng">▶</button>
                            <button id="nextBtn" class="control-btn" type="button" title="Kênh tiếp theo">⏭</button>
                            <button id="currentChannelBtn" class="control-btn current-channel-btn" type="button" title="Đến kênh đang phát">▼</button>
                            <div class="control-spacer"></div>
                            <button id="fullscreenBtn" class="control-btn" type="button" title="Toàn màn hình">⛶</button>
                        </div>
                    </div>
                </div>
            </section>

            <aside class="panel">
                <div class="panel-header">
                    <div class="panel-title">
                        <select id="channelGroupFilter" class="channel-group-filter" title="Chọn nhóm kênh">
                            <option value="__ALL__">Tất cả các kênh</option>
                        </select>

                        <button id="calendarBtn" class="calendar-btn" type="button" title="XEM LỊCH ÂM">📅</button>
                        <button id="cinemaxBtn" class="cinemax-btn" type="button" title="IPTV SCANNING CHANNEL">🔗</button>
                        <button id="downloadAppBtn" class="cinemax-btn download-app-btn" type="button" title="TẢI ỨNG DỤNG">🧩</button>
                        <button id="xosoBtn" class="cinemax-btn xoso-btn" type="button" title="XEM KẾT QUẢ XỔ SỐ">🎰</button>
                        <button id="channelCount" class="channel-count" type="button" title="Đọc M3U hoặc xem trực tiếp M3U8">0 KÊNH</button>
                    </div>
                </div>

                <div id="channelList" class="channel-list">
                    <div class="loading">⏳ Đang tải danh sách kênh.....</div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        const M3U_URL = "https://raw.githubusercontent.com/thanhthovn/iOSPremium/refs/heads/main/TRUYENHINHCAPVIETNAM.m3u";
        const CALENDAR_URL = "https://thanhthovn.github.io/amlichvn/";
        const CINEMAX_URL = "https://thanhthovn.github.io/1ptvsc4n/";
        const DOWNLOAD_APP_URL = "https://1drv.ms/u/c/e92bb0b868c9b54b/IQDAtiObV-vZTqnq_xy47T4_AVqcoYbF40ZT1Wjkyukx9xY?e=jFlFse";
        const XOSO_URL = "https://thanhthovn.github.io/xsktvn/";

        let channels = [];
        let currentChannelIndex = -1;
        let activeChannelCard = null;
        let hls = null;
        let currentPlaylistUrl = M3U_URL;

        const LOW_END_HLS_CONFIG = {
            enableWorker: true,
            lowLatencyMode: false,
            manifestLoadingTimeOut: 8000,
            maxBufferLength: 15,
            maxMaxBufferLength: 20,
            backBufferLength: 5,
            maxBufferHole: 0.5,
            startFragPrefetch: false,
            liveSyncDurationCount: 3,
            liveMaxLatencyDurationCount: 6
        };

        let playRequestId = 0;

        const player = document.getElementById("player");
        const video = document.getElementById("video");
        const playerOverlay = document.getElementById("playerOverlay");

        let progressSeekable = false;

        function normalizeTvgId(value) {
            return String(value || "")
                .trim()
                .replace(/^[#=\s'"]+|[#=\s'"]+$/g, "")
                .replace(/^tvg-(id|name)\s*[:=]?\s*/i, "")
                .toLowerCase()
                .replace(/[^a-z0-9]/g, "");
        }

        function normalizeLoose(value) {
            return normalizeTvgId(value).replace(/(hd|fhd|uhd|sd|4k)$/i, "");
        }

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return "00:00";
            const total = Math.floor(seconds);
            const h = Math.floor(total / 3600);
            const m = Math.floor((total % 3600) / 60);
            const s = total % 60;
            if (h > 0) return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
            return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
        }

        function getSeekableRange() {
            try {
                if (!video.seekable || video.seekable.length === 0) return null;
                const start = video.seekable.start(0);
                const end = video.seekable.end(video.seekable.length - 1);
                if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return null;
                return { start, end };
            } catch (_) { return null; }
        }

        function updateTimeLabels() {
            const range = getSeekableRange();
            if (range) {
                currentTimeEl.textContent = formatTime(Math.max(0, video.currentTime - range.start));
                durationTimeEl.textContent = formatTime(range.end - range.start);
            } else {
                currentTimeEl.textContent = formatTime(video.currentTime);
                durationTimeEl.textContent = "LIVE";
            }
        }

        function setProgressVisual(percent) {
            const value = Math.max(0, Math.min(100, Number(percent) || 0));
            progress.value = value;
            progress.style.background = `linear-gradient(to right, #ef4444 0%, #ef4444 ${value}%, #30382b ${value}%, #30382b 100%)`;
        }

        function updateProgressState() {
            const range = getSeekableRange();
            if (!range) {
                progressSeekable = false;
                progress.classList.add("live-only");
                setProgressVisual(100);
                updateTimeLabels();
                return;
            }
            progressSeekable = true;
            progress.classList.remove("live-only");
            const windowDuration = range.end - range.start;
            const position = Math.max(0, Math.min(windowDuration, video.currentTime - range.start));
            const percent = windowDuration > 0 ? (position / windowDuration) * 100 : 100;
            setProgressVisual(percent);
            updateTimeLabels();
        }

        document.addEventListener("visibilitychange", () => {
            if (!hls) return;

                try { hls.stopLoad(); } catch (_) {}
            } else if (!video.paused) {

            }
        });

        async function playDirectM3U8(url) {
            const requestId = ++playRequestId;
            const directUrl = String(url || "").trim();

            if (!directUrl) { alert("⚠️ Vui lòng nhập link M3U8."); return; }
            if (!/^https?:\/\//i.test(directUrl)) { alert("⚠️ Link M3U8 phải bắt đầu bằng http:// hoặc https://"); return; }

            if (hls) {
                try { hls.stopLoad(); } catch (_) {}
                try { hls.destroy(); } catch (_) {}
                hls = null;
            }
            try { video.pause(); } catch (_) {}
            video.removeAttribute("src");
            try { video.load(); } catch (_) {}
            if (requestId !== playRequestId) return;

            currentChannelIndex = -1;
            document.querySelectorAll(".channel.active").forEach(el => el.classList.remove("active"));
            activeChannelLogo.removeAttribute("src");
            activeChannelLogo.style.display = "none";
            playerTitle.textContent = "M3U8 STREAMING...";
            playerTitle.classList.remove("title-hidden");

            playerOverlay.style.color = "#88937d";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = "ĐANG TẢI LINK M3U8.....";

            progressSeekable = false;
            progress.classList.add("live-only");
            progress.value = 100;
            setProgressVisual(100);
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "LIVE";

            showVideoControls();

            return new Promise((resolve, reject) => {
                let settled = false;
                const resolveOnce = () => {
                    if (settled || requestId !== playRequestId) return;
                    settled = true;
                    playerOverlay.classList.add("hidden");
                    updatePlayButton();
                    resolve();
                };
                const rejectOnce = (err) => {
                    if (settled || requestId !== playRequestId) return;
                    settled = true;
                    console.error("Lỗi phát link M3U8:", err);
                    playerOverlay.style.color = "#f87171";
                    playerOverlay.classList.remove("hidden");
                    playerOverlay.textContent = "LINK M3U8 KHÔNG PHÁT ĐƯỢC! VUI LÒNG KIỂM TRA LINK!";
                    updatePlayButton();
                    reject(err);
                };

                if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    video.src = directUrl;
                    video.play().then(resolveOnce).catch(rejectOnce);
                    return;
                }
                if (window.Hls && Hls.isSupported()) {
                    hls = new Hls(LOW_END_HLS_CONFIG);
                    if (requestId !== playRequestId) {
                        try { hls.destroy(); } catch (_) {}
                        hls = null;
                        reject(new Error("Yêu cầu phát đã bị thay thế."));
                        return;
                    }
                    hls.loadSource(directUrl);
                    hls.attachMedia(video);
                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        if (requestId !== playRequestId) return;
                        video.play().then(resolveOnce).catch(rejectOnce);
                    });
                    hls.on(Hls.Events.ERROR, (event, data) => {
                        if (requestId !== playRequestId) return;
                        if (!data.fatal) return;
                        if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                            setTimeout(() => {
                                if (requestId !== playRequestId || !hls) return;
                                try { hls.startLoad(); } catch (_) {}
                            }, 800);
                            return;
                        }
                        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                            try { hls.recoverMediaError(); } catch (_) { rejectOnce(data); }
                            return;
                        }
                        rejectOnce(data);
                    });
                    return;
                }
                video.src = directUrl;
                video.play().then(resolveOnce).catch(rejectOnce);
            });
        }

        async function loadPlaylist(sourceUrl = M3U_URL, signal = null) {
            try {
                const response = await fetch(sourceUrl, { cache: "no-store", signal });
                if (!response.ok) throw new Error("HTTP " + response.status);
                const text = await response.text();
                const parsedChannels = parseM3U(text);
                if (parsedChannels.length === 0) throw new Error("Playlist không có kênh");

                channels = parsedChannels;
                currentPlaylistUrl = sourceUrl;
                updateChannelGroupFilter();
                renderChannels();

                let defaultIndex = channels.findIndex(ch => ch.name.toUpperCase().includes("VTV6"));
                if (defaultIndex === -1) defaultIndex = 0;
                playChannelByIndex(defaultIndex, false, true);
            } catch (error) {
                if (error?.name === "AbortError") return;
                console.error("PLAYLIST ERROR:", error);
                alert("❌ Không tải được link M3U này.\n\nHãy kiểm tra lại link, CORS hoặc playlist có đúng định dạng M3U/M3U8 hay không.");
                throw error;
            }
        }

        function parseM3U(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            let info = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (line.toUpperCase().startsWith("#EXTINF")) {
                    const comma = line.indexOf(",");
                    let name = comma >= 0 ? line.substring(comma + 1).trim() : "Kênh không tên";
                    const tvgName = getAttribute(line, "tvg-name");
                    if (tvgName) name = tvgName;

                    info = {
                        name,
                        logo: getAttribute(line, "tvg-logo"),
                        group: getAttribute(line, "group-title") || getAttribute(line, "tvg-group") || "Khác"
                    };
                    continue;
                }
                if (line.startsWith("#")) continue;
                if (info) {
                    result.push({ ...info, url: line });
                    info = null;
                }
            }
            return result;
        }

        function getAttribute(line, attribute) {
            const escaped = attribute.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
            const regex = new RegExp(escaped + '\\s*=\\s*(?:"([^"]*)"|\'([^\']*)\'|([^\\s,]+))', "i");
            const match = line.match(regex);
            return match ? (match[1] || match[2] || match[3] || "").trim() : "";
        }

        function updateChannelGroupFilter() {
            if (!channelGroupFilter) return;
            const groups = [...new Set(
                channels.map(channel => (channel.group || "Khác").trim()).filter(Boolean)
            )].sort((a, b) => a.localeCompare(b, "vi"));

            channelGroupFilter.innerHTML = "";
            const allOption = document.createElement("option");
            allOption.value = "__ALL__";
            allOption.textContent = "Tất cả các kênh";
            channelGroupFilter.appendChild(allOption);

            groups.forEach(group => {
                const option = document.createElement("option");
                option.value = group;
                option.textContent = group;
                channelGroupFilter.appendChild(option);
            });

            if (groups.includes(selectedChannelGroup)) {
                channelGroupFilter.value = selectedChannelGroup;
            } else {
                selectedChannelGroup = "__ALL__";
                channelGroupFilter.value = "__ALL__";
            }
        }

        function getFilteredChannels() {
            if (selectedChannelGroup === "__ALL__") return channels;
            return channels.filter(channel => (channel.group || "Khác").trim() === selectedChannelGroup);
        }

        function renderChannels() {
            channelList.innerHTML = "";
            activeChannelCard = null;

            const filteredChannels = getFilteredChannels();
            channelCount.textContent = filteredChannels.length + " KÊNH";

            if (filteredChannels.length === 0) {
                channelList.innerHTML = '<div class="empty">Không có kênh trong nhóm này.</div>';
                return;
            }

            filteredChannels.forEach(channel => {
                const index = channels.indexOf(channel);
                const item = document.createElement("div");
                item.dataset.channelIndex = String(index);

                logoContainer.className = "channel-logo";

                if (channel.logo) {
                    const img = document.createElement("img");
                    img.src = channel.logo;
                    img.alt = channel.name;
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.onerror = function () {
                        this.style.display = "none";
                        fallback.style.display = "flex";
                    };
                    logoContainer.appendChild(img);
                    fallback.style.display = "none";

                name.className = "channel-name";
                name.textContent = channel.name;
                info.appendChild(name);

                item.appendChild(logoContainer);
                item.appendChild(info);
                item.addEventListener("click", () => playChannelByIndex(index, true, false));
                channelList.appendChild(item);
            });

        function playChannelByIndex(index, scrollToTop = true, isInitialAutoplay = false) {
            const requestId = ++playRequestId;

            if (hls) {
                try { hls.stopLoad(); } catch (_) {}
                try { hls.destroy(); } catch (_) {}
                hls = null;
            }
            try { video.pause(); } catch (_) {}
            video.removeAttribute("src");
            try { video.load(); } catch (_) {}
            if (requestId !== playRequestId) return;
            if (index < 0 || index >= channels.length) return;

            currentChannelIndex = index;
            const channel = channels[index];

            if (channel.logo) {
                activeChannelLogo.src = channel.logo;
                activeChannelLogo.style.display = "inline-block";
                activeChannelLogo.onerror = () => { activeChannelLogo.style.display = "none"; };
            } else {
                activeChannelLogo.style.display = "none";
            }

            if (activeChannelCard) activeChannelCard.classList.remove("active");
            activeChannelCard = channelList.querySelector(`.channel[data-channel-index="${index}"]`);
            if (activeChannelCard) activeChannelCard.classList.add("active");

            if (scrollToTop) window.scrollTo({ top: 0, behavior: "smooth" });

            video.pause();
            progressSeekable = false;
            progress.classList.add("live-only");
            progress.value = 100;
            setProgressVisual(100);
            currentTimeEl.textContent = "00:00";
            durationTimeEl.textContent = "LIVE";

            if (isInitialAutoplay) {
                video.muted = true;
                unmuteBanner.classList.remove("hidden");
            } else if (!video.muted) {
                unmuteBanner.classList.add("hidden");
            }

            playerTitle.textContent = channel.name;
            playerTitle.classList.remove("title-hidden");

            playerOverlay.style.color = "#88937d";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = `ĐANG TẢI KÊNH ${channel.name}.....`;

            showVideoControls();

            const url = channel.url;

            if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = url;
                video.play().then(handlePlaySuccess).catch(handlePlayError);
            } else if (window.Hls && Hls.isSupported()) {
                hls = new Hls(LOW_END_HLS_CONFIG);
                if (requestId !== playRequestId) return;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    if (requestId !== playRequestId) return;
                    video.play().then(handlePlaySuccess).catch(handlePlayError);
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (requestId !== playRequestId) return;
                    if (!data.fatal) return;
                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                        setTimeout(() => {
                            if (requestId !== playRequestId || !hls) return;
                            try { hls.startLoad(); } catch (_) {}
                        }, 800);
                        return;
                    }
                    if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                        try { hls.recoverMediaError(); } catch (_) { handlePlayError(data); }
                        return;
                    }
                    handlePlayError(data);
                });
            } else {
                video.src = url;
                video.play().then(handlePlaySuccess).catch(handlePlayError);
            }
        }

        function handlePlaySuccess() {
            playerOverlay.classList.add("hidden");
            updatePlayButton();
        }

        function handlePlayError(err) {
            if (err && (err.name === "AbortError" || /play\(\).*interrupted.*pause\(\)/i.test(String(err.message || err)))) {
                return;
            }
            console.error("Lỗi phát luồng video:", err);
            playerOverlay.style.color = "#f87171";
            playerOverlay.classList.remove("hidden");
            playerOverlay.textContent = "KÊNH NÀY KHÔNG PHÁT ĐƯỢC! VUI LÒNG CHỌN KÊNH KHÁC!";
            updatePlayButton();
        }

        function updatePlayButton() {
            playBtn.textContent = video.paused ? "▶" : "⏸";
        }

        function toggleFullscreen() {
            const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
            if (!isFullscreen) {
                const elem = player;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {
                        if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
                    });
                } else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
                else if (elem.mozRequestFullScreen) elem.mozRequestFullScreen();
                else if (elem.msRequestFullscreen) elem.msRequestFullscreen();
                else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        function hideVideoControls(delay = 1000) {

                    videoControls.classList.add("controls-hidden");

                    if (playerTitle) playerTitle.classList.add("title-hidden");

        // =========================================================
        // PARSE LINKWORKS.TXT
        // Mỗi dòng bắt đầu bằng # là TÊN NHÓM (chính là tvg-id)
        // =========================================================
        function parseLinkworks(text) {
            const groups = [];
            let current = null;

            for (const raw of String(text || "").split(/\r?\n/)) {
                const line = raw.trim();
                if (!line) continue;

                if (line.startsWith("#")) {
                    let id = line.substring(1).trim();
                    id = id.replace(/^tvg-(id|name)\s*[:=]?\s*/i, "");
                    id = id.replace(/^[:=]\s*/, "");
                    id = id.replace(/^["']|["']$/g, "").trim();
                    if (id) {
                        current = { id: id, urls: [] };
                        groups.push(current);
                    }
                    continue;
                }

                if (/^https?:\/\//i.test(line)) {
                    if (!current) {
                        current = { id: "Chưa phân nhóm", urls: [] };
                        groups.push(current);
                    }
                    current.urls.push(line);
                }
            }
            return groups.filter(group => group.urls.length);
        }

            const miniNote = modal.querySelector("#scannerPlayerNote");

            let miniHls = null;
            let miniPlayRequest = 0;

            // KHO LƯU LINK PHÁT ĐƯỢC — key: tvg-id normalized → URL gốc từ linkworks
            const playableByGroup = new Map();

            function stopMiniPlayer() {
                miniPlayRequest++;
                if (miniHls) { try { miniHls.destroy(); } catch (_) {} miniHls = null; }
                try { miniVideo.pause(); } catch (_) {}
                miniVideo.removeAttribute("src");

            function playMiniLink(url, label) {
                const request = ++miniPlayRequest;

                miniVideo.removeAttribute("src");

                miniTitle.textContent = "Đang phát thử: " + label;

                    const cleanup = () => {

                        miniVideo.removeEventListener("playing", onPlaying);

                    const finish = (result) => {

                        settled = true;
                        cleanup();
                        resolve(result);

                        miniNote.textContent = "✅ ĐANG PHÁT THỰC TẾ — link phát được.";

                    const onVideoError = () => {

                        finish({ playable: false, message: "Trình phát báo lỗi media." });
                    };

                    timer = setTimeout(() => {
                        if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã chuyển sang link khác." });
                        miniNote.textContent = "⚠ Chưa xác nhận phát được: quá 10s không có sự kiện playing.";
                        finish({ playable: false, message: "Hết thời gian chờ, chưa xác nhận phát được." });
                    }, 10000);

                    miniVideo.addEventListener("playing", onPlaying, { once: true });
                    miniVideo.addEventListener("error", onVideoError, { once: true });
                    miniVideo.muted = true;

                    if (miniVideo.canPlayType("application/vnd.apple.mpegurl")) {
                        miniVideo.src = url;
                        miniVideo.play().catch(err => {
                            if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã chuyển link." });
                            miniNote.textContent = err?.name === "NotAllowedError" ? "Trình duyệt chặn tự phát." : "Không phát được: " + (err?.message || "lỗi phát");
                            finish({ playable: false, message: miniNote.textContent });
                        });
                    } else if (window.Hls && Hls.isSupported()) {
                        miniHls = new Hls(LOW_END_HLS_CONFIG);
                        miniHls.loadSource(url);
                        miniHls.attachMedia(miniVideo);
                        miniHls.on(Hls.Events.MANIFEST_PARSED, () => {
                            if (request !== miniPlayRequest) return;
                            miniVideo.play().catch(err => {
                                if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã chuyển link." });
                                miniNote.textContent = err?.name === "NotAllowedError" ? "Trình duyệt chặn tự phát." : "Không phát được: " + (err?.message || "lỗi phát");
                                finish({ playable: false, message: miniNote.textContent });
                            });
                        });
                        miniHls.on(Hls.Events.ERROR, (_event, data) => {
                            if (request !== miniPlayRequest || !data.fatal) return;
                            miniNote.textContent = "Lỗi phát luồng: " + (data.details || data.type || "không xác định");
                            finish({ playable: false, message: miniNote.textContent });
                        });
                    } else {
                        miniVideo.src = url;
                        miniVideo.play().catch(err => {
                            if (request !== miniPlayRequest) return finish({ playable: false, cancelled: true, message: "Đã chuyển link." });
                            miniNote.textContent = err?.name === "NotAllowedError" ? "Trình duyệt chặn tự phát." : "Không phát được: " + (err?.message || "lỗi phát");
                            finish({ playable: false, message: miniNote.textContent });
                        });
                    }
                });
            }

            const loadBtn = modal.querySelector("#scannerLoad");
            const allBtn = modal.querySelector("#scannerTestAll");
            const stopBtn = modal.querySelector("#scannerStop");
            const exportBtn = modal.querySelector("#scannerExportM3U");
            let groups = [];
            let running = false;
            let stopRequested = false;

            const close = () => { stopMiniPlayer(); modal.remove(); };
            modal.querySelector("#scannerClose").addEventListener("click", close);
            modal.addEventListener("click", e => { if (e.target === modal) close(); });
            const escHandler = e => {
                if (e.key === "Escape" && document.body.contains(modal)) {
                    close();
                    document.removeEventListener("keydown", escHandler);

            document.addEventListener("keydown", escHandler);

            function setStatus(el, message, type = "") {
                el.className = "scanner-status" + (type ? " " + type : "");
                el.textContent = message;
            }

            async function checkStream(url) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 9000);
                try {
                    const response = await fetch(url, { method: "GET", cache: "no-store", signal: controller.signal });
                    if (!response.ok) return { type: "bad", text: `HTTP ${response.status}` };
                    const body = await response.text();
                    if (!body.trim()) return { type: "warn", text: `HTTP ${response.status}, nội dung rỗng` };
                    if (!body.trimStart().startsWith("#EXTM3U")) {
                        return { type: "warn", text: `HTTP ${response.status} — không thấy manifest HLS` };
                    }
                    return { type: "ok", text: `HLS manifest đọc được (HTTP ${response.status})` };
                } catch (err) {
                    if (err && err.name === "AbortError") return { type: "warn", text: "Quá thời gian chờ" };
                    return { type: "warn", text: "Không đọc được phản hồi (CORS/token/IP)" };
                } finally { clearTimeout(timeout); }
            }

            async function getDestination(url) {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 12000);
                try {
                    const response = await fetch(url, {
                        method: "GET", redirect: "follow",
                        cache: "no-store", signal: controller.signal
                    });
                    const destination = response.url || url;
                    let noSignal = destination.toLowerCase().includes("no-signal");
                    try {
                        const body = await response.text();
                        if (body.toLowerCase().includes("no-signal")) noSignal = true;
                    } catch (_) {}
                    return {
                        destination,
                        type: noSignal ? "bad" : (response.ok ? "ok" : "warn"),
                        message: noSignal ? "Đích trả về no-signal" : `Đã theo redirect · HTTP ${response.status}`
                    };
                } catch (err) {
                    return {
                        destination: "",
                        type: "warn",
                        message: err?.name === "AbortError" ? "GET LINK ĐÍCH quá thời gian chờ" : "Không lấy được link đích (CORS/token)"
                    };
                } finally { clearTimeout(timeout); }
            }

            async function resolveDestinationForRow(url, destinationEl) {
                if (destinationEl?.dataset.destination) {
                    return { destination: destinationEl.dataset.destination, type: "ok", message: "Đã có link đích" };
                }
                if (destinationEl) destinationEl.textContent = "LINK ĐÍCH: Đang tự động lấy...";
                const result = await getDestination(url);
                if (destinationEl) {
                    if (result.destination) {
                        destinationEl.replaceChildren();
                        const label = document.createElement("strong");
                        label.textContent = "LINK ĐÍCH: ";
                        const value = document.createElement("span");
                        value.textContent = result.destination;
                        destinationEl.append(label, value);
                        destinationEl.dataset.destination = result.destination;
                    } else {
                        destinationEl.textContent = "LINK ĐÍCH: " + result.message;
                        destinationEl.dataset.destination = "";
                    }
                    updateSummary();
                }
                return result;
            }

            // TEST BẰNG LINK GỐC (url từ linkworks.txt) — không dùng link đích
            // Status không kèm link cho gọn
            async function testRow(button, statusEl, url, groupKey) {
                button.disabled = true;
                button.textContent = "ĐANG DÒ + PHÁT...";
                setStatus(statusEl, "Đang tự lấy link đích, kiểm tra và thử phát thực tế...", "");

                try {
                    playableByGroup.delete(groupKey);

                    const row = statusEl.closest(".scanner-link");
                    const destinationEl = row?.querySelector(".scanner-destination");

                    // Vẫn dò link đích để hiển thị tham khảo
                    await resolveDestinationForRow(url, destinationEl);

                    // TEST BẰNG LINK GỐC
                    const protocolResult = await checkStream(url);
                    const playback = await playMiniLink(url, row?.querySelector(".scanner-url")?.textContent || "link");

                    if (playback.playable) {
                        // LƯU LINK GỐC từ linkworks.txt
                        playableByGroup.set(groupKey, url);
                        console.log(`💾 Lưu winner cho nhóm "${groupKey}": ${url}`);
                        setStatus(statusEl, `✅ PHÁT ĐƯỢC`, "ok");
                        return { type: "ok" };
                    }

                    const result = {
                        type: protocolResult.type === "bad" ? "bad" : "warn",
                        text: `⚠ KHÔNG PHÁT ĐƯỢC — ${playback.message || "trình phát chưa bắt đầu phát"}`
                    };
                    setStatus(statusEl, result.text, result.type);
                    return result;
                } finally {
                    button.disabled = false;
                    button.textContent = "TEST LẠI";
                }
            }

            function render() {

                if (!groups.length) {
                    results.innerHTML = '<div class="scanner-empty">Không tìm thấy URL trong linkworks.txt.<br>Kiểm tra file có nằm cùng thư mục với index.html và đúng định dạng #tên-nhóm / URL.</div>';

                        destination.dataset.destination = "";

                        info.append(urlEl, destination, status);

                        const actions = document.createElement("div");
                        actions.style.cssText = "display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-content:start";

                        const playBtnEl = document.createElement("button");
                        playBtnEl.type = "button";
                        playBtnEl.className = "scanner-btn primary";
                        playBtnEl.textContent = "▶ PHÁT";
                        playBtnEl.addEventListener("click", async () => {
                            playBtnEl.disabled = true;
                            setStatus(status, "Đang phát thử...", "");
                            try {
                                // Dùng LINK GỐC từ linkworks.txt
                                const playback = await playMiniLink(url, `#${group.id} · link ${ui + 1}`);
                                if (playback.playable) {
                                    playableByGroup.set(groupKey, url);

                                } else {
                                    setStatus(status, `⚠ KHÔNG PHÁT ĐƯỢC — ${playback.message || "chưa phát"}`, "warn");
                                }
                                updateSummary();
                            } finally {
                                playBtnEl.disabled = false;
                            }
                        });

                        const btn = document.createElement("button");
                        btn.type = "button";
                        btn.className = "scanner-btn";
                        btn.textContent = "TEST LINK";
                        btn.addEventListener("click", async () => {
                            if (running) return;
                            try {
                                await testRow(btn, status, url, groupKey);
                            } catch (err) {
                                setStatus(status, "Lỗi khi kiểm tra: " + String(err?.message || err), "warn");
                            }
                            updateSummary();
                        });

                        row._scanner = { url, status, destination, testBtn: btn, groupKey };
                        actions.append(playBtnEl, btn);
                        row.append(info, actions);
                        section.appendChild(row);

                    results.appendChild(section);

                allBtn.disabled = false;
