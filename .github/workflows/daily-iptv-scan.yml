name: Daily IPTV Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-iptv-scan.yml'
      - 'automation/iptv_scan/**'
  schedule:
    # 01:00 and 13:00 Vietnam time (UTC+7)
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-iptv-scan
  cancel-in-progress: false

jobs:
  scan-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Scan channels, check links, and export M3U
        working-directory: automation/iptv_scan
        run: python main.py

      - name: Publish validated M3U file to repository root
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source_file="automation/iptv_scan/output/TRUYENHINHCAPVIETNAM_checked.m3u"

          if [[ ! -s "$source_file" ]]; then
            echo "::error::Expected scan output is missing or empty: $source_file"
            exit 1
          fi

          if ! head -c 4096 "$source_file" | grep -q '^#EXTM3U'; then
            echo "::error::Exported file does not start with #EXTM3U"
            exit 1
          fi

          if ! grep -Eq '^[[:space:]]*https?://[^[:space:]]+' "$source_file"; then
            echo "::error::Exported M3U contains no HTTP(S) stream URLs"
            exit 1
          fi

          cp "$source_file" TRUYENHINHCAPVIETNAM.m3u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRUYENHINHCAPVIETNAM.m3u
          if git diff --cached --quiet; then
            echo "The published M3U has not changed; no commit needed."
          else
            git commit -m "Update checked IPTV M3U playlist"
            git push
          fi

      - name: Upload scan results and M3U
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-M3U-Results
          path: automation/iptv_scan/output/
          if-no-files-found: warn
          retention-days: 14
