name: Daily IPTV Scan

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-iptv-scan.yml'
      - 'automation/iptv_scan/**'
  schedule:
    # 01:00 and 13:00 Vietnam time (UTC+7)
    - cron: "0 18 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-iptv-scan
  cancel-in-progress: false

jobs:
  scan-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 250

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Run IPTV scanner unit tests
        run: python -m unittest discover -s automation/iptv_scan -p 'test_*.py' -v

      - name: Scan channels, check links, and export M3U
        working-directory: automation/iptv_scan
        run: python main.py

      - name: Publish M3U file to repository root
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          source="automation/iptv_scan/output/TRUYENHINHCAPVIETNAM_checked.m3u"
          if [ ! -f "$source" ]; then
            echo "::error::Scanner did not produce the expected validated M3U: $source"
            exit 1
          fi
          python - "$source" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          content = path.read_text(encoding="utf-8-sig").strip()
          if not content.startswith("#EXTM3U"):
              raise SystemExit(f"Invalid M3U header in {path}")
          urls = [line.strip() for line in content.splitlines()
                  if line.strip() and not line.lstrip().startswith("#")]
          if not urls:
              raise SystemExit(f"No stream URLs in {path}")
          print(f"Validated {len(urls)} stream URLs in {path}")
          PY
          cp "$source" TRUYENHINHCAPVIETNAM.m3u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRUYENHINHCAPVIETNAM.m3u
          if git diff --cached --quiet; then
            echo "The published M3U has not changed; no commit needed."
          else
            git commit -m "Update checked IPTV M3U playlist"
            git push
          fi

      - name: Upload scan results and M3U
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-M3U-Results
          path: automation/iptv_scan/output/
          if-no-files-found: warn
          retention-days: 14
