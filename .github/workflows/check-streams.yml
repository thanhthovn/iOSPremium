name: Check IPTV streams

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-stream-check
  cancel-in-progress: false

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check candidate links and update playlist
        run: python check_streams.py
        env:
          PLAYLIST_FILE: TRUYENHINHCAPVIETNAM.m3u
          SOURCES_FILE: linkworks.txt
          CHECK_TIMEOUT: "12"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TRUYENHINHCAPVIETNAM.m3u
          if git diff --cached --quiet; then
            echo "Playlist unchanged; no commit needed."
          else
            git commit -m "chore: refresh IPTV playlist"
            git push
          fi

      - name: Upload stream check report
        if: always() && hashFiles('stream_status.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iptv-stream-status
          path: stream_status.json
          retention-days: 7
